name: Deploy Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: vyapari-darbaar-dev
  cancel-in-progress: false

permissions:
  contents: read


jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Laravel CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: vyapari_darbaar_test
          MYSQL_USER: vyapari_test
          MYSQL_PASSWORD: vyapari_test_password
          MYSQL_ROOT_PASSWORD: root_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2

        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_mysql, redis, xml, curl, fileinfo, zip
          coverage: none
          tools: composer:v2


      - name: Verify PHP
        shell: bash

        run: |
          set -euo pipefail

          php -v
          composer --version

          php -r '
          $required = [
              "pdo_mysql",
              "redis",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
              "zip",
          ];

          foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(
                      STDERR,
                      "ERROR: Missing PHP extension: {$extension}\n"
                  );

                  exit(1);
              }
          }

          echo "PHP extensions PASS\n";
          '


      - name: Create CI Environment
        shell: bash

        run: |
          set -euo pipefail

          APP_KEY="$(
            php -r 'echo "base64:" . base64_encode(random_bytes(32));'
          )"

          cat > .env <<EOF
          APP_NAME="Vyapari Darbaar"
          APP_ENV=testing
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=http://127.0.0.1

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=vyapari_darbaar_test
          DB_USERNAME=vyapari_test
          DB_PASSWORD=vyapari_test_password

          CACHE_STORE=redis
          QUEUE_CONNECTION=redis

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          REDIS_DB=0
          REDIS_CACHE_DB=1

          REDIS_PREFIX=vyapari_darbaar_ci_database_
          CACHE_PREFIX=vyapari_darbaar_ci_cache_

          SESSION_DRIVER=array

          MAIL_MAILER=array
          MAIL_FROM_ADDRESS=test@example.com
          MAIL_FROM_NAME="Vyapari Darbaar"

          FRONTEND_ADMIN_URL=http://localhost:3000
          FRONTEND_USER_URL=http://localhost:3000
          SUPPORT_EMAIL=support@example.com

          BCRYPT_ROUNDS=4
          EOF


      - name: Validate Composer
        shell: bash

        run: |
          set -euo pipefail

          composer validate --no-check-publish


      - name: Install Dependencies
        shell: bash

        run: |
          set -euo pipefail

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress


      - name: Laravel Environment Check
        shell: bash

        run: |
          set -euo pipefail

          php artisan --version
          php artisan env


      - name: Verify Redis
        shell: bash

        run: |
          set -euo pipefail

          php -r '
          try {
              if (!class_exists("Redis")) {
                  throw new RuntimeException(
                      "PhpRedis extension unavailable"
                  );
              }

              $redis = new Redis();

              if (!$redis->connect(
                  "127.0.0.1",
                  6379,
                  5
              )) {
                  throw new RuntimeException(
                      "Unable to connect to Redis"
                  );
              }

              if ($redis->ping() === false) {
                  throw new RuntimeException(
                      "Redis PING failed"
                  );
              }

              $redis->select(0);

              $key = "vyapari-ci-default-" . getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 0 failed"
                  );
              }

              $redis->del($key);


              $redis->select(1);

              $key = "vyapari-ci-cache-" . getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 1 failed"
                  );
              }

              $redis->del($key);
              $redis->close();

              echo "Redis PASS\n";

          } catch (Throwable $e) {

              fwrite(
                  STDERR,
                  "ERROR: " .
                  $e->getMessage() .
                  PHP_EOL
              );

              exit(1);
          }
          '


      - name: Clear Laravel Cache
        shell: bash

        run: |
          set -euo pipefail

          php artisan optimize:clear


      - name: Run Migrations
        shell: bash

        run: |
          set -euo pipefail

          php artisan migrate --force


      - name: Run Tests
        shell: bash

        run: |
          set -euo pipefail

          php artisan test


      - name: Verify Laravel Caches
        shell: bash

        run: |
          set -euo pipefail

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan optimize:clear



  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy Dev Server
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_HOST: vyaparidarbaar.holiplaces.com

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      # ==========================================================
      # DEPLOYMENT ID
      # ==========================================================

      - name: Create Deployment ID
        shell: bash

        run: |
          set -euo pipefail

          DEPLOY_ID="$(
            date +%Y%m%d%H%M%S
          )-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" \
            >> "$GITHUB_ENV"

          echo "Deploy ID: $DEPLOY_ID"


      # ==========================================================
      # NETWORK DIAGNOSTICS
      # ==========================================================

      - name: Diagnose Server Network
        shell: bash

        run: |
          set +e

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          echo "========================================"
          echo "GITHUB RUNNER NETWORK DIAGNOSTICS"
          echo "========================================"

          echo
          echo "===== RUNNER PUBLIC IPV4 ====="

          RUNNER_IP="$(
            curl \
              -4 \
              -fsS \
              --connect-timeout 10 \
              https://api.ipify.org \
              2>/dev/null
          )"

          CURL_RESULT=$?

          if [ "$CURL_RESULT" -eq 0 ] && [ -n "$RUNNER_IP" ]; then
              echo "$RUNNER_IP"
          else
              echo "Unable to determine runner public IPv4"
          fi


          echo
          echo "===== SERVER ====="

          echo "Host: $HOST"
          echo "SSH Port: $PORT"


          echo
          echo "===== ROUTE ====="

          ip route get "$HOST" \
            2>&1 \
            || true


          echo
          echo "===== TCP $PORT / SSH ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" \
            2>/dev/null
          then

              echo "SSH PORT ${PORT}: PASS"
              SSH_RESULT=0

          else

              echo "SSH PORT ${PORT}: FAIL"
              SSH_RESULT=1

          fi


          echo
          echo "===== TCP 80 / HTTP ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${HOST}/80" \
            2>/dev/null
          then

              echo "PORT 80: PASS"
              HTTP_RESULT=0

          else

              echo "PORT 80: FAIL"
              HTTP_RESULT=1

          fi


          echo
          echo "===== TCP 443 / HTTPS ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${HOST}/443" \
            2>/dev/null
          then

              echo "PORT 443: PASS"
              HTTPS_RESULT=0

          else

              echo "PORT 443: FAIL"
              HTTPS_RESULT=1

          fi


          echo
          echo "========================================"
          echo "NETWORK SUMMARY"
          echo "========================================"

          if [ "$SSH_RESULT" -eq 0 ]; then
              echo "SSH ${PORT}: REACHABLE"
          else
              echo "SSH ${PORT}: UNREACHABLE"
          fi

          if [ "$HTTP_RESULT" -eq 0 ]; then
              echo "HTTP 80: REACHABLE"
          else
              echo "HTTP 80: UNREACHABLE"
          fi

          if [ "$HTTPS_RESULT" -eq 0 ]; then
              echo "HTTPS 443: REACHABLE"
          else
              echo "HTTPS 443: UNREACHABLE"
          fi


          if [ "$SSH_RESULT" -ne 0 ]; then

              echo
              echo "::error::GitHub runner cannot reach SSH port ${PORT}."

              if \
                [ "$HTTP_RESULT" -eq 0 ] || \
                [ "$HTTPS_RESULT" -eq 0 ]
              then

                  echo "::error::Server itself is reachable, but SSH is blocked."
                  echo "::error::Check hosting-provider firewall/security policy for TCP ${PORT}."

              else

                  echo "::error::GitHub runner cannot reach SSH, HTTP or HTTPS."
                  echo "::error::Check provider networking/routing/firewall."

              fi

              if [ -n "$RUNNER_IP" ]; then

                  echo
                  echo "Runner IPv4 for provider investigation:"
                  echo "$RUNNER_IP"

              fi

              exit 1

          fi


          echo
          echo "Network preflight PASS"

          exit 0


      # ==========================================================
      # SSH RETRY CHECK
      # ==========================================================

      - name: Wait For SSH
        shell: bash

        run: |
          set -euo pipefail

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          CONNECTED=0


          for ATTEMPT in 1 2 3 4 5
          do

              echo "SSH connectivity attempt ${ATTEMPT}/5"


              if timeout 10 bash -c \
                "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" \
                2>/dev/null
              then

                  CONNECTED=1

                  echo "SSH connectivity PASS"

                  break

              fi


              if [ "$ATTEMPT" -lt 5 ]; then

                  WAIT_SECONDS="$((ATTEMPT * 5))"

                  echo "Retrying in ${WAIT_SECONDS}s..."

                  sleep "$WAIT_SECONDS"

              fi

          done


          if [ "$CONNECTED" -ne 1 ]; then

              echo "::error::SSH unavailable after 5 attempts"

              exit 1

          fi


      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        shell: bash

        run: |
          set -euo pipefail

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          mkdir -p "$HOME/.ssh"


          printf '%s\n' \
            "${{ secrets.DEV_SSH_KEY }}" \
            > "$HOME/.ssh/deploy_key"


          chmod 600 \
            "$HOME/.ssh/deploy_key"


          KEYSCAN_OK=0


          for ATTEMPT in 1 2 3 4 5
          do

              echo "ssh-keyscan attempt ${ATTEMPT}/5"

              rm -f \
                "$HOME/.ssh/server_key"


              if ssh-keyscan \
                -4 \
                -T 10 \
                -p "$PORT" \
                -t ed25519 \
                "$HOST" \
                2>/dev/null \
                > "$HOME/.ssh/server_key"
              then

                  if [ -s "$HOME/.ssh/server_key" ]; then

                      KEYSCAN_OK=1

                      break

                  fi

              fi


              sleep "$((ATTEMPT * 5))"

          done


          if [ "$KEYSCAN_OK" -ne 1 ]; then

              echo "::error::Unable to retrieve SSH host key"

              exit 1

          fi


          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"


          ACTUAL_FINGERPRINT="$(
            ssh-keygen \
              -lf "$HOME/.ssh/server_key" \
            | awk 'NR == 1 {print $2}'
          )"


          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"


          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then

              echo "::error::SSH fingerprint mismatch"

              exit 1

          fi


          cp \
            "$HOME/.ssh/server_key" \
            "$HOME/.ssh/known_hosts"


          chmod 600 \
            "$HOME/.ssh/known_hosts"


          rm -f \
            "$HOME/.ssh/server_key"


          echo "SSH setup PASS"


      # ==========================================================
      # SSH LOGIN
      # ==========================================================

      - name: Verify SSH Login
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" \
            '
            set -e

            echo "SSH LOGIN PASS"
            echo "User: $(whoami)"

            php8.3 -v
            composer --version
            '


      # ==========================================================
      # SERVER PREFLIGHT
      # ==========================================================

      - name: Server Preflight
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          BASE_PATH="${{ secrets.DEV_BASE_PATH }}"

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"


          echo "========================================"
          echo "SERVER PREFLIGHT"
          echo "========================================"

          echo "Base path:    $BASE_PATH"
          echo "Current path: $CURRENT_PATH"
          echo "Shared path:  $SHARED_PATH"


          for COMMAND in \
              php8.3 \
              composer \
              rsync \
              mysqldump \
              gzip \
              python3
          do

              command -v "$COMMAND" \
                >/dev/null 2>&1 \
                || {
                    echo "ERROR: $COMMAND missing"
                    exit 1
                }

          done


          echo "Required commands PASS"


          php8.3 -r '
          $extensions = [
              "redis",
              "pdo_mysql",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
          ];

          foreach ($extensions as $extension) {

              if (!extension_loaded($extension)) {

                  fwrite(
                      STDERR,
                      "ERROR: Missing PHP extension: {$extension}\n"
                  );

                  exit(1);

              }

          }

          echo "Server PHP extensions PASS\n";
          '


          test -f "$SHARED_PATH/.env" || {
              echo "ERROR: $SHARED_PATH/.env missing"
              exit 1
          }


          test -r "$SHARED_PATH/.env" || {
              echo "ERROR: shared .env not readable"
              exit 1
          }


          mkdir -p \
            "$SHARED_PATH/storage/app/private" \
            "$SHARED_PATH/storage/app/public" \
            "$SHARED_PATH/storage/framework/cache/data" \
            "$SHARED_PATH/storage/framework/sessions" \
            "$SHARED_PATH/storage/framework/testing" \
            "$SHARED_PATH/storage/framework/views" \
            "$SHARED_PATH/storage/logs" \
            "$SHARED_PATH/backups"


          test -w "$SHARED_PATH/storage" || {
              echo "ERROR: shared storage not writable"
              exit 1
          }


          test -w "$SHARED_PATH/backups" || {
              echo "ERROR: backup directory not writable"
              exit 1
          }


          if [ -L "$CURRENT_PATH" ]; then

              TARGET="$(
                readlink -f "$CURRENT_PATH" \
                  || true
              )"


              if [ "$TARGET" = "$BASE_PATH/releases/bootstrap" ]; then

                  echo "Converting bootstrap release symlink..."

                  rm "$CURRENT_PATH"

                  mkdir -p "$CURRENT_PATH"

              else

                  echo "ERROR: current is unexpected symlink"
                  echo "Target: $TARGET"

                  exit 1

              fi

          fi


          mkdir -p \
            "$CURRENT_PATH"


          test -d "$CURRENT_PATH" || {
              echo "ERROR: current directory missing"
              exit 1
          }


          test -w "$CURRENT_PATH" || {
              echo "ERROR: current directory not writable"
              exit 1
          }


          mkdir -p \
            "$HOME/.cache/composer"


          echo "SERVER PREFLIGHT PASS"

          REMOTE


      # ==========================================================
      # MAINTENANCE MODE
      # ==========================================================

      - name: Enable Maintenance Mode
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          CURRENT_PATH="${{ secrets.DEV_BASE_PATH }}/current"


          if \
            [ -f "$CURRENT_PATH/artisan" ] && \
            [ -f "$CURRENT_PATH/vendor/autoload.php" ]
          then

              cd "$CURRENT_PATH"

              php8.3 artisan down \
                --retry=60

              echo "Maintenance mode ON"

          else

              echo "Existing Laravel installation not found."
              echo "Maintenance mode skipped."

          fi

          REMOTE


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload Application
        shell: bash

        run: |
          set -euo pipefail

          SUCCESS=0


          for ATTEMPT in 1 2 3
          do

              echo "Rsync attempt ${ATTEMPT}/3"


              if rsync \
                -az \
                --delete-delay \
                --delay-updates \
                --partial \
                --timeout=120 \
                --no-owner \
                --no-group \
                --exclude="/.git/" \
                --exclude="/.github/" \
                --exclude="/.env" \
                --exclude="/.env.*" \
                --exclude="/vendor/" \
                --exclude="/node_modules/" \
                --exclude="/storage/" \
                --exclude="/public/storage" \
                --exclude="/bootstrap/cache/*.php" \
                --exclude="/tests/" \
                --exclude="/docs/" \
                --exclude="/phpunit.xml" \
                --exclude="/.phpunit.cache/" \
                --exclude="/README.md" \
                -e "ssh \
                  -4 \
                  -T \
                  -o BatchMode=yes \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o ConnectTimeout=15 \
                  -o ConnectionAttempts=3 \
                  -o ServerAliveInterval=15 \
                  -o ServerAliveCountMax=3 \
                  -i $HOME/.ssh/deploy_key \
                  -p ${{ secrets.DEV_PORT }}" \
                ./ \
                "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}:${{ secrets.DEV_BASE_PATH }}/current/"
              then

                  SUCCESS=1

                  echo "Rsync PASS"

                  break

              fi


              if [ "$ATTEMPT" -lt 3 ]; then

                  WAIT_SECONDS="$((ATTEMPT * 10))"

                  echo "Rsync failed."
                  echo "Retrying in ${WAIT_SECONDS}s..."

                  sleep "$WAIT_SECONDS"

              fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

              echo "::error::Rsync failed after 3 attempts"

              exit 1

          fi


      # ==========================================================
      # DEPLOY APPLICATION
      # ==========================================================

      - name: Deploy Application
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          BASE_PATH="${{ secrets.DEV_BASE_PATH }}"

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          APP_HOST="vyaparidarbaar.holiplaces.com"

          DEPLOY_ID="${{ env.DEPLOY_ID }}"

          PHP_BIN="/usr/bin/php8.3"
          COMPOSER_BIN="$(command -v composer)"


          echo "========================================"
          echo "VYAPARI DARBAAR DEV DEPLOY"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Domain:    $APP_HOST"
          echo "Path:      $CURRENT_PATH"


          cd "$CURRENT_PATH"


          # ------------------------------------------------------
          # SOURCE VALIDATION
          # ------------------------------------------------------

          test -f artisan || {
              echo "ERROR: artisan missing"
              exit 1
          }


          test -f composer.json || {
              echo "ERROR: composer.json missing"
              exit 1
          }


          test -f composer.lock || {
              echo "ERROR: composer.lock missing"
              exit 1
          }


          test -f public/index.php || {
              echo "ERROR: public/index.php missing"
              exit 1
          }


          echo "Source validation PASS"


          # ------------------------------------------------------
          # ENV LINK
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH/.env" ]; then
              rm "$CURRENT_PATH/.env"

          elif [ -e "$CURRENT_PATH/.env" ]; then
              rm -f "$CURRENT_PATH/.env"
          fi


          ln -s \
            "$SHARED_PATH/.env" \
            "$CURRENT_PATH/.env"


          test -r "$CURRENT_PATH/.env" || {
              echo "ERROR: .env symlink failed"
              exit 1
          }


          # ------------------------------------------------------
          # STORAGE LINK
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH/storage" ]; then
              rm "$CURRENT_PATH/storage"

          elif [ -e "$CURRENT_PATH/storage" ]; then
              rm -rf "$CURRENT_PATH/storage"
          fi


          ln -s \
            "$SHARED_PATH/storage" \
            "$CURRENT_PATH/storage"


          test -L "$CURRENT_PATH/storage" || {
              echo "ERROR: storage symlink failed"
              exit 1
          }


          mkdir -p \
            "$CURRENT_PATH/bootstrap/cache"


          rm -f \
            "$CURRENT_PATH"/bootstrap/cache/*.php


          chmod 2775 \
            "$CURRENT_PATH/bootstrap/cache"


          # ------------------------------------------------------
          # COMPOSER
          # ------------------------------------------------------

          export COMPOSER_CACHE_DIR="$HOME/.cache/composer"


          "$PHP_BIN" "$COMPOSER_BIN" install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress


          echo "Composer install PASS"


          # ------------------------------------------------------
          # PUBLIC STORAGE
          # ------------------------------------------------------

          if \
            [ -e "$CURRENT_PATH/public/storage" ] && \
            [ ! -L "$CURRENT_PATH/public/storage" ]
          then

              echo "ERROR: public/storage exists but is not symlink"

              exit 1

          fi


          if [ ! -L "$CURRENT_PATH/public/storage" ]; then

              "$PHP_BIN" artisan storage:link

          fi


          ACTUAL_STORAGE="$(
            readlink -f \
              "$CURRENT_PATH/public/storage" \
              || true
          )"


          EXPECTED_STORAGE="$(
            readlink -f \
              "$SHARED_PATH/storage/app/public" \
              || true
          )"


          if [ "$ACTUAL_STORAGE" != "$EXPECTED_STORAGE" ]; then

              echo "ERROR: public/storage target incorrect"
              echo "Actual:   $ACTUAL_STORAGE"
              echo "Expected: $EXPECTED_STORAGE"

              exit 1

          fi


          echo "Storage link PASS"


          # ------------------------------------------------------
          # CLEAR OLD CACHE
          # ------------------------------------------------------

          "$PHP_BIN" artisan optimize:clear


          # ------------------------------------------------------
          # INFRASTRUCTURE VALIDATION
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();


          // MySQL
          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();

          echo "MySQL connection PASS\n";


          $database = config(
              "database.connections.mysql.database"
          );


          if ($database !== "vyapari_darbaar_dev") {

              throw new RuntimeException(
                  "Unexpected database: " .
                  $database
              );

          }


          echo "Database target PASS\n";


          // Redis DBs
          $defaultDb = (string) config(
              "database.redis.default.database"
          );

          $cacheDb = (string) config(
              "database.redis.cache.database"
          );


          if ($defaultDb !== "10") {

              throw new RuntimeException(
                  "REDIS_DB must be 10"
              );

          }


          if ($cacheDb !== "11") {

              throw new RuntimeException(
                  "REDIS_CACHE_DB must be 11"
              );

          }


          echo "Redis database isolation PASS\n";


          // Queue
          if (config("queue.default") !== "redis") {

              throw new RuntimeException(
                  "QUEUE_CONNECTION must be redis"
              );

          }


          echo "Redis queue PASS\n";


          // App URL
          $expectedUrl =
              "https://vyaparidarbaar.holiplaces.com";


          $currentUrl = rtrim(
              (string) config("app.url"),
              "/"
          );


          if ($currentUrl !== $expectedUrl) {

              throw new RuntimeException(
                  "APP_URL mismatch. Expected: " .
                  $expectedUrl .
                  ", Current: " .
                  $currentUrl
              );

          }


          echo "APP_URL PASS\n";


          // Redis ping
          if (
              \Illuminate\Support\Facades\Redis::connection()
                  ->ping() === false
          ) {

              throw new RuntimeException(
                  "Redis ping failed"
              );

          }


          echo "Redis connection PASS\n";


          // Cache
          $key =
              "vyapari:deploy:cache:" .
              getmypid();


          \Illuminate\Support\Facades\Cache::store("redis")
              ->put(
                  $key,
                  "ok",
                  60
              );


          if (
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->get($key) !== "ok"
          ) {

              throw new RuntimeException(
                  "Redis cache test failed"
              );

          }


          \Illuminate\Support\Facades\Cache::store("redis")
              ->forget($key);


          echo "Redis cache PASS\n";


          // Lock
          $lock =
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->lock(
                      "vyapari:deploy:lock:" .
                      getmypid(),
                      10
                  );


          if (!$lock->get()) {

              throw new RuntimeException(
                  "Redis lock failed"
              );

          }


          $lock->release();


          echo "Redis lock PASS\n";
          '


          # ------------------------------------------------------
          # DB CONFIG FOR BACKUP
          # ------------------------------------------------------

          export CURRENT_PATH


          DB_NAME="$(
            "$PHP_BIN" -r '
            require getenv("CURRENT_PATH")."/vendor/autoload.php";

            $app =
                require getenv("CURRENT_PATH")."/bootstrap/app.php";

            $app->make(
                \Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            echo config(
                "database.connections.mysql.database"
            );
            '
          )"


          DB_USER="$(
            "$PHP_BIN" -r '
            require getenv("CURRENT_PATH")."/vendor/autoload.php";

            $app =
                require getenv("CURRENT_PATH")."/bootstrap/app.php";

            $app->make(
                \Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            echo config(
                "database.connections.mysql.username"
            );
            '
          )"


          DB_PASS="$(
            "$PHP_BIN" -r '
            require getenv("CURRENT_PATH")."/vendor/autoload.php";

            $app =
                require getenv("CURRENT_PATH")."/bootstrap/app.php";

            $app->make(
                \Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            echo config(
                "database.connections.mysql.password"
            );
            '
          )"


          DB_HOST="$(
            "$PHP_BIN" -r '
            require getenv("CURRENT_PATH")."/vendor/autoload.php";

            $app =
                require getenv("CURRENT_PATH")."/bootstrap/app.php";

            $app->make(
                \Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            echo config(
                "database.connections.mysql.host"
            );
            '
          )"


          DB_PORT="$(
            "$PHP_BIN" -r '
            require getenv("CURRENT_PATH")."/vendor/autoload.php";

            $app =
                require getenv("CURRENT_PATH")."/bootstrap/app.php";

            $app->make(
                \Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            echo config(
                "database.connections.mysql.port"
            );
            '
          )"


          DB_PORT="${DB_PORT:-3306}"


          if [ "$DB_NAME" != "vyapari_darbaar_dev" ]; then

              echo "ERROR: Unsafe database target: $DB_NAME"

              exit 1

          fi


          # ------------------------------------------------------
          # DATABASE BACKUP
          # ------------------------------------------------------

          BACKUP_FILE="$SHARED_PATH/backups/db-before-$DEPLOY_ID.sql.gz"

          BACKUP_TMP="${BACKUP_FILE}.tmp"


          rm -f \
            "$BACKUP_TMP"


          echo "Creating database backup..."


          if ! \
            MYSQL_PWD="$DB_PASS" \
            mysqldump \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USER" \
              --single-transaction \
              --quick \
              --lock-tables=false \
              --no-tablespaces \
              "$DB_NAME" \
            | gzip \
            > "$BACKUP_TMP"
          then

              rm -f \
                "$BACKUP_TMP"

              unset DB_PASS

              echo "ERROR: Database backup failed"

              exit 1

          fi


          unset DB_PASS


          if [ ! -s "$BACKUP_TMP" ]; then

              rm -f "$BACKUP_TMP"

              echo "ERROR: Database backup empty"

              exit 1

          fi


          mv \
            "$BACKUP_TMP" \
            "$BACKUP_FILE"


          chmod 600 \
            "$BACKUP_FILE"


          echo "Database backup PASS"


          # ------------------------------------------------------
          # KEEP LATEST 5 BACKUPS
          # ------------------------------------------------------

          find "$SHARED_PATH/backups" \
            -maxdepth 1 \
            -type f \
            -name 'db-before-*.sql.gz' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -f


          echo "Backup rotation PASS"


          # ------------------------------------------------------
          # MIGRATIONS
          # ------------------------------------------------------

          "$PHP_BIN" artisan migrate --force


          echo "Migrations PASS"


          # ------------------------------------------------------
          # CACHE
          # ------------------------------------------------------

          "$PHP_BIN" artisan config:cache

          "$PHP_BIN" artisan route:cache

          "$PHP_BIN" artisan view:cache


          echo "Laravel cache PASS"


          # ------------------------------------------------------
          # QUEUE
          # ------------------------------------------------------

          "$PHP_BIN" artisan queue:restart


          echo "Queue restart signal PASS"


          # ------------------------------------------------------
          # DEPLOYMENT ID
          # ------------------------------------------------------

          printf '%s\n' \
            "$DEPLOY_ID" \
            > "$CURRENT_PATH/DEPLOY_ID"


          # ------------------------------------------------------
          # APPLICATION ONLINE
          # ------------------------------------------------------

          "$PHP_BIN" artisan up


          echo "Maintenance mode OFF"


          # ------------------------------------------------------
          # POST-DEPLOY DB BOOT CHECK
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();

          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();

          echo "Laravel boot PASS\n";
          '


          # ------------------------------------------------------
          # LOCAL NGINX -> FPM -> LARAVEL CHECK
          #
          # Do not use curl/wget on this server.
          # ------------------------------------------------------

          echo "Running HTTP health check..."


          if ! python3 <<'PY'
          import http.client
          import json
          import sys

          host = "vyaparidarbaar.holiplaces.com"

          connection = None

          try:

              connection = http.client.HTTPConnection(
                  "127.0.0.1",
                  80,
                  timeout=10,
              )


              connection.request(
                  "GET",
                  "/api/admin/profile",
                  headers={
                      "Host": host,
                      "Accept": "application/json",
                      "Connection": "close",
                  },
              )


              response = connection.getresponse()

              body = response.read().decode(
                  "utf-8",
                  errors="replace",
              )


              print(
                  "HTTP STATUS:",
                  response.status,
              )

              print(
                  "CONTENT-TYPE:",
                  response.getheader(
                      "Content-Type"
                  ),
              )

              print(
                  "BODY:",
                  body[:1000],
              )


              if response.status != 401:

                  print(
                      "ERROR: Expected HTTP 401",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              try:

                  payload = json.loads(body)

              except json.JSONDecodeError:

                  print(
                      "ERROR: Response is not JSON",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              if payload.get("status") is not False:

                  print(
                      "ERROR: Invalid status field",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              if payload.get("message") != "Unauthenticated.":

                  print(
                      "ERROR: Invalid auth message",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              print(
                  "HTTP health check PASS"
              )


          except Exception as exc:

              print(
                  "ERROR: HTTP health check failed: "
                  + repr(exc),
                  file=sys.stderr,
              )

              sys.exit(1)


          finally:

              if connection is not None:

                  try:
                      connection.close()
                  except Exception:
                      pass

          PY
          then

              echo "ERROR: HTTP health check failed"

              "$PHP_BIN" artisan down \
                --retry=60 \
                || true

              exit 1

          fi


          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Domain:"
          echo "https://vyaparidarbaar.holiplaces.com"
          echo
          echo "Code:"
          echo "$CURRENT_PATH"
          echo
          echo "Deploy ID:"
          echo "$DEPLOY_ID"
          echo "========================================"

          REMOTE


      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Deployment Failure Diagnostics
        if: failure()
        continue-on-error: true
        shell: bash

        run: |
          set +e

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          echo
          echo "========================================"
          echo "DEPLOYMENT FAILURE DIAGNOSTICS"
          echo "========================================"


          echo
          echo "===== SERVER NETWORK ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" \
            2>/dev/null
          then

              echo "SSH PORT: REACHABLE"

          else

              echo "SSH PORT: UNREACHABLE"

              echo
              echo "Remote diagnostics skipped because"
              echo "GitHub runner cannot reach SSH."

              exit 0

          fi


          if [ ! -f "$HOME/.ssh/deploy_key" ]; then

              echo "SSH key was not initialized."
              echo "Remote diagnostics skipped."

              exit 0

          fi


          if [ ! -f "$HOME/.ssh/known_hosts" ]; then

              echo "known_hosts was not initialized."
              echo "Remote diagnostics skipped."

              exit 0

          fi


          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            "${{ secrets.DEV_USER }}@$HOST" << 'REMOTE' \
            || true

          set +e


          CURRENT_PATH="${{ secrets.DEV_BASE_PATH }}/current"

          SHARED_PATH="${{ secrets.DEV_BASE_PATH }}/shared"


          echo
          echo "===== ARTISAN ABOUT ====="

          if [ -f "$CURRENT_PATH/artisan" ]; then

              cd "$CURRENT_PATH"

              php8.3 artisan about \
                2>&1 \
                | tail -n 100 \
                || true

          else

              echo "artisan not found"

          fi


          echo
          echo "===== LARAVEL LOG ====="

          tail -n 100 \
            "$SHARED_PATH/storage/logs/laravel.log" \
            2>/dev/null \
            || true


          echo
          echo "===== DEPLOY ID ====="

          cat \
            "$CURRENT_PATH/DEPLOY_ID" \
            2>/dev/null \
            || true


          echo
          echo "===== DISK ====="

          df -h \
            "$CURRENT_PATH" \
            2>/dev/null \
            || true


          echo
          echo "===== MEMORY ====="

          free -h \
            2>/dev/null \
            || true

          REMOTE


          exit 0


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup SSH
        if: always()
        shell: bash

        run: |
          set +e

          rm -f \
            "$HOME/.ssh/deploy_key"

          rm -f \
            "$HOME/.ssh/server_key"

          rm -f \
            "$HOME/.ssh/known_hosts"

          exit 0
