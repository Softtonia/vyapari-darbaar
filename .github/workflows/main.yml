name: Deploy Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: vyapari-darbaar-dev
  cancel-in-progress: false

permissions:
  contents: read


jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Laravel CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: vyapari_darbaar_test
          MYSQL_USER: vyapari_test
          MYSQL_PASSWORD: vyapari_test_password
          MYSQL_ROOT_PASSWORD: root_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2

        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_mysql, redis, xml, curl, fileinfo, zip
          coverage: none
          tools: composer:v2


      - name: Verify PHP
        shell: bash

        run: |
          set -euo pipefail

          php -v
          composer --version

          php -r '
          $required = [
              "pdo_mysql",
              "redis",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
              "zip",
          ];

          foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(
                      STDERR,
                      "ERROR: Missing PHP extension: {$extension}\n"
                  );

                  exit(1);
              }
          }

          echo "PHP extensions PASS\n";
          '


      - name: Prepare Test Directories
        shell: bash

        run: |
          set -euo pipefail

          mkdir -p tests/Unit
          mkdir -p tests/Feature


      - name: Create CI Environment
        shell: bash

        run: |
          set -euo pipefail

          TEST_APP_KEY="$(
            php -r 'echo "base64:" . base64_encode(random_bytes(32));'
          )"

          cat > .env <<EOF
          APP_NAME="Vyapari Darbaar"
          APP_ENV=testing
          APP_KEY=${TEST_APP_KEY}
          APP_DEBUG=false
          APP_URL=http://127.0.0.1

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=vyapari_darbaar_test
          DB_USERNAME=vyapari_test
          DB_PASSWORD=vyapari_test_password

          CACHE_STORE=redis
          QUEUE_CONNECTION=redis

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379

          REDIS_DB=0
          REDIS_CACHE_DB=1

          REDIS_PREFIX=vyapari_darbaar_ci_database_
          CACHE_PREFIX=vyapari_darbaar_ci_cache_

          SESSION_DRIVER=array

          MAIL_MAILER=array
          MAIL_FROM_ADDRESS=test@example.com
          MAIL_FROM_NAME="Vyapari Darbaar"

          FRONTEND_ADMIN_URL=http://localhost:3000
          FRONTEND_USER_URL=http://localhost:3000
          SUPPORT_EMAIL=support@example.com

          BCRYPT_ROUNDS=4
          EOF


      - name: Validate CI Environment
        shell: bash

        run: |
          set -euo pipefail

          grep -q '^APP_ENV=testing$' .env
          grep -q '^DB_DATABASE=vyapari_darbaar_test$' .env
          grep -q '^REDIS_DB=0$' .env
          grep -q '^REDIS_CACHE_DB=1$' .env

          echo "CI environment PASS"


      - name: Validate Composer
        shell: bash

        run: |
          set -euo pipefail

          composer validate --no-check-publish


      - name: Install Composer Dependencies
        shell: bash

        run: |
          set -euo pipefail

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress


      - name: Verify Laravel
        shell: bash

        run: |
          set -euo pipefail

          php artisan --version
          php artisan env


      - name: Verify Redis
        shell: bash

        run: |
          set -euo pipefail

          php -r '
          try {
              if (!class_exists("Redis")) {
                  throw new RuntimeException(
                      "PhpRedis extension unavailable"
                  );
              }

              $redis = new Redis();

              if (!$redis->connect(
                  "127.0.0.1",
                  6379,
                  5
              )) {
                  throw new RuntimeException(
                      "Unable to connect to Redis"
                  );
              }

              if ($redis->ping() === false) {
                  throw new RuntimeException(
                      "Redis PING failed"
                  );
              }

              $redis->select(0);

              $key =
                  "vyapari-ci-default-" .
                  getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 0 failed"
                  );
              }

              $redis->del($key);


              $redis->select(1);

              $key =
                  "vyapari-ci-cache-" .
                  getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 1 failed"
                  );
              }

              $redis->del($key);

              $redis->close();

              echo "Redis PASS\n";

          } catch (Throwable $e) {
              fwrite(
                  STDERR,
                  "ERROR: " .
                  $e->getMessage() .
                  PHP_EOL
              );

              exit(1);
          }
          '


      - name: Clear Laravel Cache
        shell: bash

        run: |
          set -euo pipefail

          php artisan optimize:clear


      - name: Run Migrations
        shell: bash

        run: |
          set -euo pipefail

          php artisan migrate --force


      - name: Run Tests
        shell: bash

        run: |
          set -euo pipefail

          php artisan test


      - name: Verify Production Caches
        shell: bash

        run: |
          set -euo pipefail

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan optimize:clear



  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy Dev Server
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_HOST: vyaparidarbaar.holiplaces.com

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      # ----------------------------------------------------------
      # Deployment ID
      # ----------------------------------------------------------

      - name: Create Deployment ID
        shell: bash

        run: |
          set -euo pipefail

          DEPLOY_ID="$(
            date +%Y%m%d%H%M%S
          )-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" \
            >> "$GITHUB_ENV"

          echo "Deployment ID: $DEPLOY_ID"


      # ==========================================================
      # NETWORK PREFLIGHT
      #
      # Important:
      # Force IPv4 and retry before creating SSH configuration.
      # ==========================================================

      - name: Wait For Server SSH
        shell: bash

        run: |
          set -euo pipefail

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          echo "Checking SSH connectivity..."
          echo "Host: $HOST"
          echo "Port: $PORT"

          SUCCESS=0

          for ATTEMPT in 1 2 3 4 5 6 7 8
          do

              echo "SSH TCP attempt $ATTEMPT/8"

              if timeout 10 bash -c \
                  "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" \
                  2>/dev/null
              then

                  echo "SSH TCP connectivity PASS"

                  SUCCESS=1

                  break

              fi


              if [ "$ATTEMPT" -lt 8 ]; then

                  WAIT_SECONDS="$((ATTEMPT * 5))"

                  echo \
                    "Server unavailable. Retrying in ${WAIT_SECONDS}s..."

                  sleep "$WAIT_SECONDS"

              fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

              echo "::error::GitHub runner cannot reach server SSH port."
              echo "::error::Host=${HOST} Port=${PORT}"
              echo "::error::This is a network/firewall/server reachability problem, not Laravel."

              exit 1

          fi


      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        shell: bash

        run: |
          set -euo pipefail

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"

          mkdir -p "$HOME/.ssh"


          printf '%s\n' \
            "${{ secrets.DEV_SSH_KEY }}" \
            > "$HOME/.ssh/deploy_key"


          chmod 600 \
            "$HOME/.ssh/deploy_key"


          rm -f \
            "$HOME/.ssh/server_key"


          KEYSCAN_OK=0


          for ATTEMPT in 1 2 3 4 5
          do

              echo "SSH keyscan attempt $ATTEMPT/5"


              if ssh-keyscan \
                  -4 \
                  -T 10 \
                  -p "$PORT" \
                  -t ed25519 \
                  "$HOST" \
                  2>/dev/null \
                  > "$HOME/.ssh/server_key"
              then

                  if [ -s "$HOME/.ssh/server_key" ]; then

                      KEYSCAN_OK=1

                      break

                  fi

              fi


              rm -f \
                "$HOME/.ssh/server_key"


              sleep "$((ATTEMPT * 5))"

          done


          if [ "$KEYSCAN_OK" -ne 1 ]; then

              echo "::error::Unable to retrieve SSH server host key"

              exit 1

          fi


          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"


          ACTUAL_FINGERPRINT="$(
              ssh-keygen \
                  -lf "$HOME/.ssh/server_key" \
              | awk 'NR == 1 {print $2}'
          )"


          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then

              echo "::error::SSH host fingerprint mismatch"
              echo "Expected: $EXPECTED_FINGERPRINT"
              echo "Actual:   $ACTUAL_FINGERPRINT"

              exit 1

          fi


          cp \
            "$HOME/.ssh/server_key" \
            "$HOME/.ssh/known_hosts"


          chmod 600 \
            "$HOME/.ssh/known_hosts"


          rm -f \
            "$HOME/.ssh/server_key"


          echo "SSH fingerprint PASS"


      # ==========================================================
      # SSH VERIFICATION
      # ==========================================================

      - name: Verify SSH Login
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" \
            '
            set -e

            echo "SSH LOGIN PASS"

            whoami

            php8.3 -v

            composer --version
            '


      # ==========================================================
      # SERVER PREFLIGHT
      # ==========================================================

      - name: Server Preflight
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          BASE_PATH="${{ secrets.DEV_BASE_PATH }}"

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"


          echo "========================================"
          echo "SERVER PREFLIGHT"
          echo "========================================"


          # ------------------------------------------------------
          # Required commands
          # ------------------------------------------------------

          for COMMAND in \
              php8.3 \
              composer \
              rsync \
              mysqldump \
              gzip \
              python3
          do

              command -v "$COMMAND" \
                  >/dev/null 2>&1 \
                  || {
                      echo "ERROR: $COMMAND missing"
                      exit 1
                  }

          done


          echo "Server commands PASS"


          # ------------------------------------------------------
          # PHP extensions
          # ------------------------------------------------------

          php8.3 -r '
          $extensions = [
              "redis",
              "pdo_mysql",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
          ];

          foreach ($extensions as $extension) {

              if (!extension_loaded($extension)) {

                  fwrite(
                      STDERR,
                      "ERROR: Missing PHP extension: {$extension}\n"
                  );

                  exit(1);

              }

          }

          echo "Server PHP extensions PASS\n";
          '


          # ------------------------------------------------------
          # Shared environment
          # ------------------------------------------------------

          test -f "$SHARED_PATH/.env" || {
              echo "ERROR: shared/.env missing"
              exit 1
          }


          test -r "$SHARED_PATH/.env" || {
              echo "ERROR: shared/.env not readable"
              exit 1
          }


          # ------------------------------------------------------
          # Shared runtime directories
          # ------------------------------------------------------

          mkdir -p \
              "$SHARED_PATH/storage/app/private" \
              "$SHARED_PATH/storage/app/public" \
              "$SHARED_PATH/storage/framework/cache/data" \
              "$SHARED_PATH/storage/framework/sessions" \
              "$SHARED_PATH/storage/framework/testing" \
              "$SHARED_PATH/storage/framework/views" \
              "$SHARED_PATH/storage/logs" \
              "$SHARED_PATH/backups"


          test -w "$SHARED_PATH/storage" || {
              echo "ERROR: shared storage not writable"
              exit 1
          }


          test -w "$SHARED_PATH/backups" || {
              echo "ERROR: shared backups not writable"
              exit 1
          }


          # ------------------------------------------------------
          # Single-copy current directory
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH" ]; then

              CURRENT_TARGET="$(
                  readlink -f "$CURRENT_PATH" \
                      || true
              )"


              if [ "$CURRENT_TARGET" = "$BASE_PATH/releases/bootstrap" ]; then

                  rm "$CURRENT_PATH"

                  mkdir -p "$CURRENT_PATH"

              else

                  echo "ERROR: current is an unexpected symlink"
                  echo "Target: $CURRENT_TARGET"

                  exit 1

              fi

          fi


          mkdir -p "$CURRENT_PATH"


          test -d "$CURRENT_PATH" || {
              echo "ERROR: current directory missing"
              exit 1
          }


          test -w "$CURRENT_PATH" || {
              echo "ERROR: current directory not writable"
              exit 1
          }


          # ------------------------------------------------------
          # Remove obsolete bootstrap release only
          # ------------------------------------------------------

          if [ -d "$BASE_PATH/releases/bootstrap" ]; then

              rm -rf \
                  "$BASE_PATH/releases/bootstrap"

          fi


          if [ -d "$BASE_PATH/releases" ]; then

              RELEASE_COUNT="$(
                  find "$BASE_PATH/releases" \
                      -mindepth 1 \
                      -maxdepth 1 \
                      -print \
                  | wc -l
              )"


              if [ "$RELEASE_COUNT" -eq 0 ]; then

                  rmdir "$BASE_PATH/releases"

              else

                  echo "ERROR: Unexpected old release directories exist"

                  find "$BASE_PATH/releases" \
                      -mindepth 1 \
                      -maxdepth 1 \
                      -print

                  exit 1

              fi

          fi


          mkdir -p \
              "$HOME/.cache/composer"


          echo "SERVER PREFLIGHT PASS"

          REMOTE


      # ==========================================================
      # MAINTENANCE MODE
      # ==========================================================

      - name: Enable Maintenance Mode
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          CURRENT_PATH="${{ secrets.DEV_BASE_PATH }}/current"


          if \
              [ -f "$CURRENT_PATH/artisan" ] && \
              [ -f "$CURRENT_PATH/vendor/autoload.php" ]
          then

              cd "$CURRENT_PATH"


              php8.3 artisan down \
                  --retry=60


              echo "Maintenance mode ON"

          else

              echo "First deployment detected"
              echo "Maintenance mode skipped"

          fi

          REMOTE


      # ==========================================================
      # RSYNC WITH RETRIES
      # ==========================================================

      - name: Upload Application
        shell: bash

        run: |
          set -euo pipefail

          RSYNC_SUCCESS=0


          for ATTEMPT in 1 2 3
          do

              echo "Rsync attempt $ATTEMPT/3"


              if rsync \
                  -az \
                  --delete-delay \
                  --delay-updates \
                  --partial \
                  --timeout=120 \
                  --no-owner \
                  --no-group \
                  --exclude="/.git/" \
                  --exclude="/.github/" \
                  --exclude="/.env" \
                  --exclude="/.env.*" \
                  --exclude="/vendor/" \
                  --exclude="/node_modules/" \
                  --exclude="/storage/" \
                  --exclude="/public/storage" \
                  --exclude="/bootstrap/cache/*.php" \
                  --exclude="/tests/" \
                  --exclude="/docs/" \
                  --exclude="/phpunit.xml" \
                  --exclude="/.phpunit.cache/" \
                  --exclude="/README.md" \
                  -e "ssh \
                    -4 \
                    -T \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o ConnectTimeout=15 \
                    -o ConnectionAttempts=3 \
                    -o ServerAliveInterval=15 \
                    -o ServerAliveCountMax=3 \
                    -i $HOME/.ssh/deploy_key \
                    -p ${{ secrets.DEV_PORT }}" \
                  ./ \
                  "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}:${{ secrets.DEV_BASE_PATH }}/current/"
              then

                  RSYNC_SUCCESS=1

                  echo "Rsync PASS"

                  break

              fi


              if [ "$ATTEMPT" -lt 3 ]; then

                  echo \
                      "Rsync failed. Waiting before retry..."

                  sleep "$((ATTEMPT * 10))"

              fi

          done


          if [ "$RSYNC_SUCCESS" -ne 1 ]; then

              echo "::error::Rsync failed after 3 attempts"

              exit 1

          fi


      # ==========================================================
      # BUILD / BACKUP / MIGRATION / CACHE / HEALTH
      # ==========================================================

      - name: Deploy Application
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/deploy_key" \
            -p "${{ secrets.DEV_PORT }}" \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'REMOTE'

          set -euo pipefail


          BASE_PATH="${{ secrets.DEV_BASE_PATH }}"

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          APP_HOST="${{ env.APP_HOST }}"
          DEPLOY_ID="${{ env.DEPLOY_ID }}"

          PHP_BIN="/usr/bin/php8.3"
          COMPOSER_BIN="$(command -v composer)"


          echo "========================================"
          echo "VYAPARI DARBAAR DEV DEPLOYMENT"
          echo "========================================"

          echo "Domain:    $APP_HOST"
          echo "Code Path: $CURRENT_PATH"
          echo "Deploy ID: $DEPLOY_ID"

          echo "========================================"


          cd "$CURRENT_PATH"


          # ------------------------------------------------------
          # Source validation
          # ------------------------------------------------------

          test -f artisan || {
              echo "ERROR: artisan missing"
              exit 1
          }


          test -f composer.json || {
              echo "ERROR: composer.json missing"
              exit 1
          }


          test -f composer.lock || {
              echo "ERROR: composer.lock missing"
              exit 1
          }


          test -f public/index.php || {
              echo "ERROR: public/index.php missing"
              exit 1
          }


          echo "Source validation PASS"


          # ------------------------------------------------------
          # Shared ENV symlink
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH/.env" ]; then

              rm "$CURRENT_PATH/.env"

          elif [ -e "$CURRENT_PATH/.env" ]; then

              rm -f "$CURRENT_PATH/.env"

          fi


          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"


          test -r "$CURRENT_PATH/.env" || {
              echo "ERROR: .env symlink failed"
              exit 1
          }


          echo ".env symlink PASS"


          # ------------------------------------------------------
          # Shared storage symlink
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH/storage" ]; then

              rm "$CURRENT_PATH/storage"

          elif [ -e "$CURRENT_PATH/storage" ]; then

              rm -rf "$CURRENT_PATH/storage"

          fi


          ln -s \
              "$SHARED_PATH/storage" \
              "$CURRENT_PATH/storage"


          test -L "$CURRENT_PATH/storage" || {
              echo "ERROR: storage symlink failed"
              exit 1
          }


          echo "Storage symlink PASS"


          # ------------------------------------------------------
          # bootstrap/cache
          # ------------------------------------------------------

          mkdir -p \
              "$CURRENT_PATH/bootstrap/cache"


          rm -f \
              "$CURRENT_PATH"/bootstrap/cache/*.php


          chmod 2775 \
              "$CURRENT_PATH/bootstrap/cache"


          # ------------------------------------------------------
          # Composer
          # ------------------------------------------------------

          export COMPOSER_CACHE_DIR="$HOME/.cache/composer"


          echo "Installing production Composer dependencies..."


          "$PHP_BIN" "$COMPOSER_BIN" install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-progress


          echo "Composer install PASS"


          # ------------------------------------------------------
          # Public storage link
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/public/storage" ] && \
              [ ! -L "$CURRENT_PATH/public/storage" ]
          then

              echo "ERROR: public/storage exists but is not a symlink"

              exit 1

          fi


          if [ ! -L "$CURRENT_PATH/public/storage" ]; then

              "$PHP_BIN" artisan storage:link

          fi


          ACTUAL_STORAGE="$(
              readlink -f \
                  "$CURRENT_PATH/public/storage" \
              || true
          )"


          EXPECTED_STORAGE="$(
              readlink -f \
                  "$SHARED_PATH/storage/app/public" \
              || true
          )"


          if [ "$ACTUAL_STORAGE" != "$EXPECTED_STORAGE" ]; then

              echo "ERROR: public/storage target incorrect"
              echo "Actual:   $ACTUAL_STORAGE"
              echo "Expected: $EXPECTED_STORAGE"

              exit 1

          fi


          echo "Public storage PASS"


          # ------------------------------------------------------
          # Clear stale Laravel caches
          # ------------------------------------------------------

          "$PHP_BIN" artisan optimize:clear

          "$PHP_BIN" artisan --version


          # ------------------------------------------------------
          # Infrastructure validation
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();


          // --------------------------------------------------
          // MySQL
          // --------------------------------------------------

          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();

          echo "MySQL connection PASS\n";


          $database = config(
              "database.connections.mysql.database"
          );


          if ($database !== "vyapari_darbaar_dev") {

              throw new RuntimeException(
                  "Unexpected database: " .
                  $database
              );

          }


          echo "Database target PASS\n";


          // --------------------------------------------------
          // Redis
          // --------------------------------------------------

          $defaultDb = (string) config(
              "database.redis.default.database"
          );

          $cacheDb = (string) config(
              "database.redis.cache.database"
          );


          if ($defaultDb !== "10") {

              throw new RuntimeException(
                  "Server REDIS_DB must be 10"
              );

          }


          if ($cacheDb !== "11") {

              throw new RuntimeException(
                  "Server REDIS_CACHE_DB must be 11"
              );

          }


          echo "Redis DB isolation PASS\n";


          // --------------------------------------------------
          // Queue
          // --------------------------------------------------

          if (config("queue.default") !== "redis") {

              throw new RuntimeException(
                  "QUEUE_CONNECTION must be redis"
              );

          }


          echo "Redis queue configuration PASS\n";


          // --------------------------------------------------
          // APP URL
          // --------------------------------------------------

          $expectedUrl =
              "https://vyaparidarbaar.holiplaces.com";


          if (
              rtrim(
                  (string) config("app.url"),
                  "/"
              ) !== $expectedUrl
          ) {

              throw new RuntimeException(
                  "APP_URL must be " .
                  $expectedUrl .
                  ". Current: " .
                  config("app.url")
              );

          }


          echo "APP_URL PASS\n";


          // --------------------------------------------------
          // Redis ping
          // --------------------------------------------------

          if (
              \Illuminate\Support\Facades\Redis::connection()
                  ->ping() === false
          ) {

              throw new RuntimeException(
                  "Redis ping failed"
              );

          }


          echo "Redis connection PASS\n";


          // --------------------------------------------------
          // Cache
          // --------------------------------------------------

          $cacheKey =
              "vyapari:deploy:cache:" .
              getmypid();


          \Illuminate\Support\Facades\Cache::store("redis")
              ->put(
                  $cacheKey,
                  "ok",
                  60
              );


          if (
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->get($cacheKey) !== "ok"
          ) {

              throw new RuntimeException(
                  "Redis cache failed"
              );

          }


          \Illuminate\Support\Facades\Cache::store("redis")
              ->forget($cacheKey);


          echo "Redis cache PASS\n";


          // --------------------------------------------------
          // Redis lock
          // --------------------------------------------------

          $lock =
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->lock(
                      "vyapari:deploy:lock:" .
                      getmypid(),
                      10
                  );


          if (!$lock->get()) {

              throw new RuntimeException(
                  "Redis lock failed"
              );

          }


          $lock->release();


          echo "Redis lock PASS\n";
          '


          # ------------------------------------------------------
          # Obtain DB credentials from Laravel config
          # ------------------------------------------------------

          export CURRENT_PATH


          DB_NAME="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.database"
              );
              '
          )"


          DB_USER="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.username"
              );
              '
          )"


          DB_PASS="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.password"
              );
              '
          )"


          DB_HOST="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.host"
              );
              '
          )"


          DB_PORT="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.port"
              );
              '
          )"


          DB_PORT="${DB_PORT:-3306}"


          test "$DB_NAME" = "vyapari_darbaar_dev" || {
              echo "ERROR: Unsafe database target: $DB_NAME"
              exit 1
          }


          test -n "$DB_USER" || {
              echo "ERROR: DB username empty"
              exit 1
          }


          test -n "$DB_HOST" || {
              echo "ERROR: DB host empty"
              exit 1
          }


          # ------------------------------------------------------
          # Database backup
          # ------------------------------------------------------

          BACKUP_FILE="$SHARED_PATH/backups/db-before-$DEPLOY_ID.sql.gz"

          BACKUP_TMP="${BACKUP_FILE}.tmp"


          rm -f \
              "$BACKUP_TMP"


          echo "Creating database backup..."


          if ! \
              MYSQL_PWD="$DB_PASS" \
              mysqldump \
                  --host="$DB_HOST" \
                  --port="$DB_PORT" \
                  --user="$DB_USER" \
                  --single-transaction \
                  --quick \
                  --lock-tables=false \
                  --no-tablespaces \
                  "$DB_NAME" \
              | gzip \
                  > "$BACKUP_TMP"
          then

              rm -f \
                  "$BACKUP_TMP"

              unset DB_PASS

              echo "ERROR: Database backup failed"

              exit 1

          fi


          unset DB_PASS


          if [ ! -s "$BACKUP_TMP" ]; then

              rm -f \
                  "$BACKUP_TMP"

              echo "ERROR: Database backup empty"

              exit 1

          fi


          mv \
              "$BACKUP_TMP" \
              "$BACKUP_FILE"


          chmod 600 \
              "$BACKUP_FILE"


          echo "Database backup PASS"


          # ------------------------------------------------------
          # Keep latest 5 backups
          # ------------------------------------------------------

          find "$SHARED_PATH/backups" \
              -maxdepth 1 \
              -type f \
              -name 'db-before-*.sql.gz' \
              -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | xargs -r rm -f


          echo "Backup rotation PASS"


          # ------------------------------------------------------
          # Migrations
          # ------------------------------------------------------

          "$PHP_BIN" artisan migrate --force


          echo "Migrations PASS"


          # ------------------------------------------------------
          # Laravel production caches
          # ------------------------------------------------------

          "$PHP_BIN" artisan config:cache

          "$PHP_BIN" artisan route:cache

          "$PHP_BIN" artisan view:cache


          echo "Laravel caches PASS"


          # ------------------------------------------------------
          # Queue restart
          # ------------------------------------------------------

          "$PHP_BIN" artisan queue:restart


          echo "Queue restart signal PASS"


          # ------------------------------------------------------
          # Deployment metadata
          # ------------------------------------------------------

          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"


          # ------------------------------------------------------
          # Bring application online
          # ------------------------------------------------------

          "$PHP_BIN" artisan up


          echo "Application online"


          # ------------------------------------------------------
          # Laravel boot test
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();


          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();


          echo "Laravel post-deploy boot PASS\n";
          '


          # ------------------------------------------------------
          # HTTP Health Check
          #
          # No curl/wget because both behaved abnormally on server.
          #
          # Public hostname:
          # vyaparidarbaar.holiplaces.com
          #
          # Local request:
          # 127.0.0.1:80 + correct Host header
          #
          # Protected endpoint should return 401.
          # ------------------------------------------------------

          echo "Running HTTP health check..."


          if ! python3 <<PY
          import http.client
          import json
          import sys

          host = "${APP_HOST}"

          connection = None

          try:

              connection = http.client.HTTPConnection(
                  "127.0.0.1",
                  80,
                  timeout=10,
              )


              connection.request(
                  "GET",
                  "/api/admin/profile",
                  headers={
                      "Host": host,
                      "Accept": "application/json",
                      "Connection": "close",
                  },
              )


              response = connection.getresponse()


              body = response.read().decode(
                  "utf-8",
                  errors="replace",
              )


              print("Host:", host)

              print(
                  "HTTP status:",
                  response.status,
              )

              print(
                  "Content-Type:",
                  response.getheader(
                      "Content-Type"
                  ),
              )

              print(
                  "Response:",
                  body[:1000],
              )


              if response.status != 401:

                  print(
                      "ERROR: Expected HTTP 401",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              try:

                  payload = json.loads(body)

              except json.JSONDecodeError:

                  print(
                      "ERROR: Response is not JSON",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              if payload.get("status") is not False:

                  print(
                      "ERROR: Unexpected status field",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              if (
                  payload.get("message")
                  != "Unauthenticated."
              ):

                  print(
                      "ERROR: Unexpected auth response",
                      file=sys.stderr,
                  )

                  sys.exit(1)


              print(
                  "HTTP application health check PASS"
              )


          except Exception as exc:

              print(
                  "ERROR: HTTP health check failed: "
                  + repr(exc),
                  file=sys.stderr,
              )

              sys.exit(1)


          finally:

              if connection is not None:

                  try:

                      connection.close()

                  except Exception:

                      pass

          PY
          then

              echo "ERROR: Post-deployment HTTP health check failed"


              "$PHP_BIN" artisan down \
                  --retry=60 \
                  || true


              exit 1

          fi


          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Domain:    $APP_HOST"
          echo "Code Path: $CURRENT_PATH"
          echo "Deploy ID: $DEPLOY_ID"
          echo "========================================"

          REMOTE


      # ==========================================================
      # FAILURE DIAGNOSTICS
      #
      # IMPORTANT:
      # This step NEVER causes a second SSH exit-code 255.
      # If server is unreachable, it reports and exits success.
      # ==========================================================

      - name: Deployment Failure Diagnostics
        if: failure()
        continue-on-error: true
        shell: bash

        run: |
          set +e

          echo "========================================"
          echo "DEPLOYMENT FAILED"
          echo "========================================"

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_PORT }}"


          # ------------------------------------------------------
          # Do not attempt SSH diagnostics if network is down
          # ------------------------------------------------------

          if ! timeout 10 bash -c \
              "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" \
              2>/dev/null
          then

              echo "Server SSH is currently unreachable."
              echo "Host: $HOST"
              echo "Port: $PORT"
              echo
              echo "Skipping remote diagnostics because the"
              echo "network connection itself is unavailable."

              exit 0

          fi


          # ------------------------------------------------------
          # SSH key may not exist if setup failed earlier
          # ------------------------------------------------------

          if [ ! -f "$HOME/.ssh/deploy_key" ]; then

              echo "SSH private key was not initialized."
              echo "Skipping remote diagnostics."

              exit 0

          fi


          # ------------------------------------------------------
          # Remote diagnostics
          # ------------------------------------------------------

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            "${{ secrets.DEV_USER }}@$HOST" << 'REMOTE' \
            || true

          set +e


          CURRENT_PATH="${{ secrets.DEV_BASE_PATH }}/current"

          SHARED_PATH="${{ secrets.DEV_BASE_PATH }}/shared"


          echo
          echo "===== ARTISAN ABOUT ====="


          if [ -f "$CURRENT_PATH/artisan" ]; then

              cd "$CURRENT_PATH"

              php8.3 artisan about \
                  2>&1 \
                  | tail -n 100 \
                  || true

          else

              echo "artisan not found"

          fi


          echo
          echo "===== LARAVEL LOG ====="


          tail -n 100 \
              "$SHARED_PATH/storage/logs/laravel.log" \
              2>/dev/null \
              || true


          echo
          echo "===== DEPLOYMENT ID ====="


          cat \
              "$CURRENT_PATH/DEPLOY_ID" \
              2>/dev/null \
              || true


          echo
          echo "===== PHP-FPM ====="


          systemctl is-active \
              php8.3-fpm \
              2>/dev/null \
              || true


          echo
          echo "===== DISK ====="


          df -h \
              "$CURRENT_PATH" \
              2>/dev/null \
              || true


          echo
          echo "===== MEMORY ====="


          free -h \
              2>/dev/null \
              || true

          REMOTE


          exit 0


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup SSH
        if: always()
        shell: bash

        run: |
          set +e

          rm -f \
              "$HOME/.ssh/deploy_key"

          rm -f \
              "$HOME/.ssh/server_key"

          rm -f \
              "$HOME/.ssh/known_hosts"

          exit 0
