name: Deploy Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: vyapari-darbaar-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: "185.131.53.137"
  DEPLOY_PORT: "2222"
  DEPLOY_USER: "deploy"

  DEPLOY_BASE_PATH: "/var/www/api.vyaparidarbar.com"

  PHP_BIN: "/usr/bin/php8.3"


jobs:

  # ============================================================
  # EXISTING DEPLOYMENT
  # DO NOT MODIFY FOR POSTMAN
  # ============================================================

  deploy:
    name: Deploy Dev Server

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v7


      # ========================================================
      # DEPLOYMENT ID
      # ========================================================

      - name: Create Deployment ID
        shell: bash

        run: |
          set -euo pipefail

          DEPLOY_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

          echo "Deploy ID: $DEPLOY_ID"


      # ========================================================
      # SSH
      # ========================================================

      - name: Setup SSH
        shell: bash

        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}

        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "::error::DEV_SSH_KEY repository secret is missing."
              exit 1
          fi

          mkdir -p "$HOME/.ssh"

          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
              | tr -d '\r' \
              > "$HOME/.ssh/vyapari_deploy_key"

          chmod 600 "$HOME/.ssh/vyapari_deploy_key"


          if ! ssh-keygen \
              -y \
              -f "$HOME/.ssh/vyapari_deploy_key" \
              >/dev/null 2>&1
          then
              echo "::error::DEV_SSH_KEY is not a valid private key."
              exit 1
          fi


          HOST_KEY_FILE="$HOME/.ssh/vyapari_host_key"

          rm -f "$HOST_KEY_FILE"

          KEYSCAN_OK=0

          for ATTEMPT in 1 2 3
          do
              echo "Reading SSH host key: attempt ${ATTEMPT}/3"

              if ssh-keyscan \
                  -4 \
                  -T 10 \
                  -p "$DEPLOY_PORT" \
                  -t ed25519 \
                  "$DEPLOY_HOST" \
                  2>/dev/null \
                  > "$HOST_KEY_FILE"
              then
                  if [ -s "$HOST_KEY_FILE" ]; then
                      KEYSCAN_OK=1
                      break
                  fi
              fi

              sleep "$((ATTEMPT * 3))"
          done


          if [ "$KEYSCAN_OK" -ne 1 ]; then
              echo "::error::Unable to retrieve SSH host key."
              exit 1
          fi


          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"

          ACTUAL_FINGERPRINT="$(
              ssh-keygen -lf "$HOST_KEY_FILE" \
                  | awk 'NR == 1 {print $2}'
          )"


          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"


          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::SSH host fingerprint mismatch."
              exit 1
          fi


          cp "$HOST_KEY_FILE" "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"


          cat > "$HOME/.ssh/config" <<EOF
          Host vyapari-dev
              HostName ${DEPLOY_HOST}
              Port ${DEPLOY_PORT}
              User ${DEPLOY_USER}
              IdentityFile ${HOME}/.ssh/vyapari_deploy_key
              IdentitiesOnly yes
              BatchMode yes
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              StrictHostKeyChecking yes
              UserKnownHostsFile ${HOME}/.ssh/known_hosts
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF


          chmod 600 "$HOME/.ssh/config"

          rm -f "$HOST_KEY_FILE"

          echo "SSH setup PASS"


      # ========================================================
      # SERVER PREPARE
      # ========================================================

      - name: Prepare Server
        shell: bash

        run: |
          set -euo pipefail

          ssh vyapari-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"


          echo "========================================"
          echo "PREPARING SERVER"
          echo "========================================"

          echo "Base:    $BASE_PATH"
          echo "Current: $CURRENT_PATH"
          echo "Shared:  $SHARED_PATH"


          for COMMAND in \
              php8.3 \
              composer \
              rsync \
              mysqldump \
              gzip
          do
              if ! command -v "$COMMAND" >/dev/null 2>&1; then
                  echo "ERROR: Missing command: $COMMAND"
                  exit 1
              fi
          done


          test -f "$SHARED_PATH/.env" || {
              echo "ERROR: Shared .env missing:"
              echo "$SHARED_PATH/.env"
              exit 1
          }


          test -r "$SHARED_PATH/.env" || {
              echo "ERROR: Shared .env is not readable."
              exit 1
          }


          mkdir -p \
              "$CURRENT_PATH" \
              "$SHARED_PATH/storage/app/private" \
              "$SHARED_PATH/storage/app/public" \
              "$SHARED_PATH/storage/framework/cache/data" \
              "$SHARED_PATH/storage/framework/sessions" \
              "$SHARED_PATH/storage/framework/testing" \
              "$SHARED_PATH/storage/framework/views" \
              "$SHARED_PATH/storage/logs" \
              "$SHARED_PATH/backups" \
              "$HOME/.cache/composer"


          test -w "$CURRENT_PATH" || {
              echo "ERROR: Current directory is not writable."
              exit 1
          }


          test -w "$SHARED_PATH/storage" || {
              echo "ERROR: Shared storage is not writable."
              exit 1
          }


          test -w "$SHARED_PATH/backups" || {
              echo "ERROR: Backup directory is not writable."
              exit 1
          }


          echo "Server preparation PASS"

          REMOTE


      # ========================================================
      # MAINTENANCE MODE
      # ========================================================

      - name: Enable Maintenance Mode
        shell: bash

        run: |
          set -euo pipefail

          ssh vyapari-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"


          if \
              [ -f "$CURRENT_PATH/artisan" ] && \
              [ -f "$CURRENT_PATH/vendor/autoload.php" ]
          then
              cd "$CURRENT_PATH"

              php8.3 artisan down --retry=60

              echo "Maintenance mode ON"
          else
              echo "Existing Laravel installation not ready."
              echo "Maintenance mode skipped."
          fi

          REMOTE


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload Application
        shell: bash

        run: |
          set -euo pipefail

          RSYNC_OK=0


          for ATTEMPT in 1 2 3
          do
              echo "Rsync attempt ${ATTEMPT}/3"


              if rsync \
                  -az \
                  --delete-delay \
                  --delay-updates \
                  --partial \
                  --timeout=120 \
                  --no-owner \
                  --no-group \
                  --exclude="/.git/" \
                  --exclude="/.github/" \
                  --exclude="/.env" \
                  --exclude="/.env.*" \
                  --exclude="/vendor/" \
                  --exclude="/node_modules/" \
                  --exclude="/storage/" \
                  --exclude="/public/storage" \
                  --exclude="/bootstrap/cache/*.php" \
                  --exclude="/tests/" \
                  --exclude="/docs/" \
                  --exclude="/phpunit.xml" \
                  --exclude="/.phpunit.cache/" \
                  --exclude="/README.md" \
                  -e "ssh -F $HOME/.ssh/config" \
                  ./ \
                  "vyapari-dev:${DEPLOY_BASE_PATH}/current/"
              then
                  RSYNC_OK=1

                  echo "Upload PASS"

                  break
              fi


              if [ "$ATTEMPT" -lt 3 ]; then
                  sleep "$((ATTEMPT * 10))"
              fi
          done


          if [ "$RSYNC_OK" -ne 1 ]; then
              echo "::error::Application upload failed."
              exit 1
          fi


      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy Application
        shell: bash

        run: |
          set -euo pipefail

          ssh vyapari-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' DEPLOY_ID='$DEPLOY_ID' bash -s" <<'REMOTE'

          set -euo pipefail


          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          PHP_BIN="/usr/bin/php8.3"

          COMPOSER_BIN="$(command -v composer)"


          echo "========================================"
          echo "VYAPARI DARBAAR DEPLOY"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Path:      $CURRENT_PATH"

          echo "========================================"


          cd "$CURRENT_PATH"


          # ------------------------------------------------------
          # REQUIRED APPLICATION FILES
          # ------------------------------------------------------

          test -f artisan || {
              echo "ERROR: artisan missing."
              exit 1
          }


          test -f composer.json || {
              echo "ERROR: composer.json missing."
              exit 1
          }


          test -f composer.lock || {
              echo "ERROR: composer.lock missing."
              exit 1
          }


          test -f public/index.php || {
              echo "ERROR: public/index.php missing."
              exit 1
          }


          # ------------------------------------------------------
          # .ENV
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/.env" ] && \
              [ ! -L "$CURRENT_PATH/.env" ]
          then
              echo "ERROR: current/.env is not a symlink."
              exit 1
          fi


          rm -f "$CURRENT_PATH/.env"


          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"


          # ------------------------------------------------------
          # STORAGE
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/storage" ] && \
              [ ! -L "$CURRENT_PATH/storage" ]
          then
              echo "ERROR: current/storage is not a symlink."
              exit 1
          fi


          rm -f "$CURRENT_PATH/storage"


          ln -s \
              "$SHARED_PATH/storage" \
              "$CURRENT_PATH/storage"


          # ------------------------------------------------------
          # BOOTSTRAP CACHE
          # ------------------------------------------------------

          mkdir -p "$CURRENT_PATH/bootstrap/cache"


          rm -f \
              "$CURRENT_PATH"/bootstrap/cache/*.php


          chmod 2775 \
              "$CURRENT_PATH/bootstrap/cache"


          # ------------------------------------------------------
          # COMPOSER
          # ------------------------------------------------------

          export COMPOSER_CACHE_DIR="$HOME/.cache/composer"


          echo "Installing Composer dependencies..."


          "$PHP_BIN" "$COMPOSER_BIN" install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-progress


          echo "Composer install PASS"


          # ------------------------------------------------------
          # PUBLIC STORAGE LINK
          # ------------------------------------------------------

          mkdir -p \
              "$SHARED_PATH/storage/app/public"


          if \
              [ -e "$CURRENT_PATH/public/storage" ] && \
              [ ! -L "$CURRENT_PATH/public/storage" ]
          then
              echo "ERROR: public/storage is not a symlink."
              exit 1
          fi


          rm -f \
              "$CURRENT_PATH/public/storage"


          ln -s \
              "$SHARED_PATH/storage/app/public" \
              "$CURRENT_PATH/public/storage"


          echo "Storage links PASS"


          # ------------------------------------------------------
          # CLEAR OLD LARAVEL CACHE
          # ------------------------------------------------------

          "$PHP_BIN" artisan optimize:clear


          # ------------------------------------------------------
          # DATABASE CONFIG
          # ------------------------------------------------------

          export CURRENT_PATH


          DB_NAME="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH") . "/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH") . "/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.database"
              );
              '
          )"


          DB_USER="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH") . "/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH") . "/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.username"
              );
              '
          )"


          DB_PASS="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH") . "/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH") . "/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.password"
              );
              '
          )"


          DB_HOST="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH") . "/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH") . "/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.host"
              );
              '
          )"


          DB_PORT="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH") . "/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH") . "/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.port"
              );
              '
          )"


          DB_PORT="${DB_PORT:-3306}"


          # ------------------------------------------------------
          # DATABASE SAFETY
          # ------------------------------------------------------

          if [ "$DB_NAME" != "vyapari_darbaar_dev" ]; then
              unset DB_PASS

              echo "ERROR: Unsafe database target: $DB_NAME"

              exit 1
          fi


          test -n "$DB_USER" || {
              unset DB_PASS
              echo "ERROR: Database username is empty."
              exit 1
          }


          test -n "$DB_HOST" || {
              unset DB_PASS
              echo "ERROR: Database host is empty."
              exit 1
          }


          # ------------------------------------------------------
          # DATABASE BACKUP
          # ------------------------------------------------------

          BACKUP_FILE="$SHARED_PATH/backups/db-before-$DEPLOY_ID.sql.gz"

          BACKUP_TMP="${BACKUP_FILE}.tmp"


          rm -f "$BACKUP_TMP"


          echo "Creating database backup..."


          if ! \
              MYSQL_PWD="$DB_PASS" \
              mysqldump \
                  --host="$DB_HOST" \
                  --port="$DB_PORT" \
                  --user="$DB_USER" \
                  --single-transaction \
                  --quick \
                  --lock-tables=false \
                  --no-tablespaces \
                  "$DB_NAME" \
              | gzip \
              > "$BACKUP_TMP"
          then
              rm -f "$BACKUP_TMP"

              unset DB_PASS

              echo "ERROR: Database backup failed."

              exit 1
          fi


          unset DB_PASS


          if [ ! -s "$BACKUP_TMP" ]; then
              rm -f "$BACKUP_TMP"

              echo "ERROR: Database backup is empty."

              exit 1
          fi


          mv \
              "$BACKUP_TMP" \
              "$BACKUP_FILE"


          chmod 600 \
              "$BACKUP_FILE"


          echo "Database backup PASS"


          # ------------------------------------------------------
          # KEEP ONLY LATEST 5 DATABASE BACKUPS
          # ------------------------------------------------------

          find "$SHARED_PATH/backups" \
              -maxdepth 1 \
              -type f \
              -name 'db-before-*.sql.gz' \
              -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | xargs -r rm -f


          # ------------------------------------------------------
          # MIGRATIONS
          # ------------------------------------------------------

          echo "Running migrations..."


          "$PHP_BIN" artisan migrate --force


          echo "Migrations PASS"


          # ------------------------------------------------------
          # LARAVEL CACHE
          # ------------------------------------------------------

          "$PHP_BIN" artisan config:cache

          "$PHP_BIN" artisan route:cache

          "$PHP_BIN" artisan view:cache


          echo "Laravel cache PASS"


          # ------------------------------------------------------
          # QUEUE
          # ------------------------------------------------------

          "$PHP_BIN" artisan queue:restart


          echo "Queue restart signal sent"


          # ------------------------------------------------------
          # DEPLOYMENT ID
          # ------------------------------------------------------

          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"


          # ------------------------------------------------------
          # APPLICATION LIVE
          # ------------------------------------------------------

          "$PHP_BIN" artisan up


          echo
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Path:      $CURRENT_PATH"

          echo "========================================"

          REMOTE


      # ========================================================
      # CLEANUP
      # ========================================================

      - name: Cleanup SSH
        if: always()

        shell: bash

        run: |
          set +e

          rm -f \
              "$HOME/.ssh/vyapari_deploy_key" \
              "$HOME/.ssh/vyapari_host_key" \
              "$HOME/.ssh/known_hosts" \
              "$HOME/.ssh/config"

          exit 0


  # ============================================================
  # POSTMAN SYNC
  #
  # Completely separate from deployment.
  # No SSH.
  # No server changes.
  # Does not make deployment fail.
  # ============================================================

  sync-postman:
    name: Sync Postman

    needs:
      - deploy

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
      POSTMAN_ENVIRONMENT_ID: ${{ secrets.POSTMAN_ENVIRONMENT_ID }}
      POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}

      POSTMAN_COLLECTION_FILE: "docs/postman/Vyapari-Darbaar.postman_collection.json"
      POSTMAN_ENVIRONMENT_FILE: "docs/postman/Vyapari-Darbaar.postman_environment.json"

    steps:

      # ========================================================
      # CHECKOUT
      # Non-blocking: Postman must never affect deployment.
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v7
        continue-on-error: true


      # ========================================================
      # POSTMAN SYNC
      # ========================================================

      - name: Sync Collection And Environment
        shell: bash

        run: |
          set +e

          echo "========================================"
          echo "POSTMAN SYNC"
          echo "========================================"

          SYNC_ERRORS=0


          # ------------------------------------------------------
          # CHECK REQUIRED SECRETS
          # ------------------------------------------------------

          if [ -z "${POSTMAN_API_KEY:-}" ]; then
              echo "::warning::POSTMAN_API_KEY secret is missing."
              echo "Postman sync skipped."
              exit 0
          fi


          if [ -z "${POSTMAN_COLLECTION_ID:-}" ]; then
              echo "::warning::POSTMAN_COLLECTION_ID secret is missing."
              SYNC_ERRORS=1
          fi


          if [ -z "${POSTMAN_ENVIRONMENT_ID:-}" ]; then
              echo "::warning::POSTMAN_ENVIRONMENT_ID secret is missing."
              SYNC_ERRORS=1
          fi


          if [ -n "${POSTMAN_WORKSPACE_ID:-}" ]; then
              echo "Postman workspace configuration: PRESENT"
          else
              echo "::warning::POSTMAN_WORKSPACE_ID secret is missing."
          fi


          # ------------------------------------------------------
          # NORMALIZE POSTMAN UID -> UUID
          #
          # Supports:
          #
          # d0abe7fe-9334-4423-bc29-576cec0be296
          #
          # and:
          #
          # 41558668-d0abe7fe-9334-4423-bc29-576cec0be296
          # ------------------------------------------------------

          normalize_postman_id()
          {
              local VALUE="$1"

              if [[ "$VALUE" =~ ^[0-9]+-([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$ ]]
              then
                  printf '%s' "${BASH_REMATCH[1]}"
              else
                  printf '%s' "$VALUE"
              fi
          }


          COLLECTION_ID=""

          ENVIRONMENT_ID=""


          if [ -n "${POSTMAN_COLLECTION_ID:-}" ]; then
              COLLECTION_ID="$(
                  normalize_postman_id \
                      "$POSTMAN_COLLECTION_ID"
              )"
          fi


          if [ -n "${POSTMAN_ENVIRONMENT_ID:-}" ]; then
              ENVIRONMENT_ID="$(
                  normalize_postman_id \
                      "$POSTMAN_ENVIRONMENT_ID"
              )"
          fi


          UUID_REGEX='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'


          if \
              [ -n "$COLLECTION_ID" ] && \
              [[ ! "$COLLECTION_ID" =~ $UUID_REGEX ]]
          then
              echo "::warning::POSTMAN_COLLECTION_ID format is invalid."
              COLLECTION_ID=""
              SYNC_ERRORS=1
          fi


          if \
              [ -n "$ENVIRONMENT_ID" ] && \
              [[ ! "$ENVIRONMENT_ID" =~ $UUID_REGEX ]]
          then
              echo "::warning::POSTMAN_ENVIRONMENT_ID format is invalid."
              ENVIRONMENT_ID=""
              SYNC_ERRORS=1
          fi


          # ------------------------------------------------------
          # VERIFY JQ
          # ------------------------------------------------------

          if ! command -v jq >/dev/null 2>&1; then
              echo "::warning::jq is unavailable on GitHub runner."
              echo "Postman sync skipped."
              exit 0
          fi


          # ======================================================
          # COLLECTION
          # ======================================================

          if [ -z "$COLLECTION_ID" ]; then

              echo "::warning::Collection sync skipped because collection ID is unavailable."

          elif [ ! -f "$POSTMAN_COLLECTION_FILE" ]; then

              echo "::warning::Postman collection file not found:"
              echo "$POSTMAN_COLLECTION_FILE"

              SYNC_ERRORS=1

          else

              echo "Validating Postman collection..."


              if ! jq -e '
                  type == "object"
                  and (.info | type == "object")
                  and (.info.name | type == "string")
                  and (.item | type == "array")
              ' "$POSTMAN_COLLECTION_FILE" >/dev/null
              then

                  echo "::warning::Postman collection JSON is invalid."

                  SYNC_ERRORS=1

              else

                  echo "Postman collection JSON PASS"


                  COLLECTION_PAYLOAD="$RUNNER_TEMP/postman-collection-payload.json"

                  COLLECTION_RESPONSE="$RUNNER_TEMP/postman-collection-response.json"


                  jq \
                      '{collection: .}' \
                      "$POSTMAN_COLLECTION_FILE" \
                      > "$COLLECTION_PAYLOAD"


                  echo "Syncing Postman collection..."


                  COLLECTION_STATUS="$(
                      curl \
                          --silent \
                          --show-error \
                          --connect-timeout 15 \
                          --max-time 90 \
                          --retry 3 \
                          --retry-delay 2 \
                          --output "$COLLECTION_RESPONSE" \
                          --write-out '%{http_code}' \
                          --request PUT \
                          "https://api.postman.com/collections/${COLLECTION_ID}" \
                          --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                          --header "Content-Type: application/json" \
                          --data-binary "@${COLLECTION_PAYLOAD}"
                  )"


                  CURL_EXIT=$?


                  echo "Postman collection HTTP status: ${COLLECTION_STATUS:-N/A}"


                  if \
                      [ "$CURL_EXIT" -ne 0 ] || \
                      [ "$COLLECTION_STATUS" != "200" ]
                  then

                      echo "::warning::Postman collection sync failed."

                      if [ -s "$COLLECTION_RESPONSE" ]; then
                          cat "$COLLECTION_RESPONSE"
                      fi

                      SYNC_ERRORS=1

                  else

                      echo "Postman collection sync PASS"

                  fi

              fi

          fi


          # ======================================================
          # ENVIRONMENT
          # ======================================================

          if [ -z "$ENVIRONMENT_ID" ]; then

              echo "::warning::Environment sync skipped because environment ID is unavailable."

          elif [ ! -f "$POSTMAN_ENVIRONMENT_FILE" ]; then

              echo "::warning::Postman environment file not found:"
              echo "$POSTMAN_ENVIRONMENT_FILE"

              SYNC_ERRORS=1

          else

              echo "Validating Postman environment..."


              if ! jq -e '
                  type == "object"
                  and (.name | type == "string")
                  and (.values | type == "array")
              ' "$POSTMAN_ENVIRONMENT_FILE" >/dev/null
              then

                  echo "::warning::Postman environment JSON is invalid."

                  SYNC_ERRORS=1

              else

                  echo "Postman environment JSON PASS"


                  ENVIRONMENT_PAYLOAD="$RUNNER_TEMP/postman-environment-payload.json"

                  ENVIRONMENT_RESPONSE="$RUNNER_TEMP/postman-environment-response.json"


                  jq '
                      {
                          environment: {
                              name: .name,
                              values: (.values // [])
                          }
                      }
                  ' "$POSTMAN_ENVIRONMENT_FILE" \
                      > "$ENVIRONMENT_PAYLOAD"


                  echo "Syncing Postman environment..."


                  ENVIRONMENT_STATUS="$(
                      curl \
                          --silent \
                          --show-error \
                          --connect-timeout 15 \
                          --max-time 90 \
                          --retry 3 \
                          --retry-delay 2 \
                          --output "$ENVIRONMENT_RESPONSE" \
                          --write-out '%{http_code}' \
                          --request PUT \
                          "https://api.postman.com/environments/${ENVIRONMENT_ID}" \
                          --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                          --header "Content-Type: application/json" \
                          --data-binary "@${ENVIRONMENT_PAYLOAD}"
                  )"


                  CURL_EXIT=$?


                  echo "Postman environment HTTP status: ${ENVIRONMENT_STATUS:-N/A}"


                  if \
                      [ "$CURL_EXIT" -ne 0 ] || \
                      [ "$ENVIRONMENT_STATUS" != "200" ]
                  then

                      echo "::warning::Postman environment sync failed."

                      if [ -s "$ENVIRONMENT_RESPONSE" ]; then
                          cat "$ENVIRONMENT_RESPONSE"
                      fi

                      SYNC_ERRORS=1

                  else

                      echo "Postman environment sync PASS"

                  fi

              fi

          fi


          echo
          echo "========================================"

          if [ "$SYNC_ERRORS" -eq 0 ]; then
              echo "POSTMAN SYNC SUCCESS"
          else
              echo "POSTMAN SYNC COMPLETED WITH WARNINGS"
              echo "Laravel deployment was NOT affected."
          fi

          echo "========================================"


          # ------------------------------------------------------
          # IMPORTANT:
          # Postman must never make Laravel deploy fail.
          # ------------------------------------------------------

          exit 0
