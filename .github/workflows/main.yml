name: Deploy Dev

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: vyapari-darbaar-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ------------------------------------------------------------
  # PUBLIC / NON-SECRET DEPLOYMENT CONFIG
  # ------------------------------------------------------------
  DEPLOY_HOST: "185.131.53.137"
  DEPLOY_PORT: "2222"
  DEPLOY_USER: "deploy"

  DEPLOY_BASE_PATH: "/var/www/api.vyaparidarbar.com"

  APP_HOST: "api.vyaparidarbar.com"
  APP_URL: "https://api.vyaparidarbar.com"

  PHP_BIN: "/usr/bin/php8.3"


jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Laravel CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: vyapari_darbaar_test
          MYSQL_USER: vyapari_test
          MYSQL_PASSWORD: vyapari_test_password
          MYSQL_ROOT_PASSWORD: root_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15


    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7


      # ----------------------------------------------------------
      # PHP
      # ----------------------------------------------------------

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2

        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, pdo_mysql, redis, xml, curl, fileinfo, zip
          coverage: none
          tools: composer:v2

        env:
          fail-fast: true


      - name: Verify PHP
        shell: bash

        run: |
          set -euo pipefail

          echo "===== PHP ====="
          php -v

          echo
          echo "===== COMPOSER ====="
          composer --version

          echo
          echo "===== EXTENSIONS ====="

          php -r '
          $required = [
              "pdo_mysql",
              "redis",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
              "zip",
          ];

          foreach ($required as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(
                      STDERR,
                      "ERROR: Missing PHP extension: {$extension}\n"
                  );

                  exit(1);
              }

              echo "{$extension}: PASS\n";
          }
          '


      # ----------------------------------------------------------
      # CI ENV
      # ----------------------------------------------------------

      - name: Create CI Environment
        shell: bash

        run: |
          set -euo pipefail

          APP_KEY="$(
            php -r 'echo "base64:" . base64_encode(random_bytes(32));'
          )"

          cat > .env <<EOF
          APP_NAME="Vyapari Darbaar"
          APP_ENV=testing
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=http://127.0.0.1

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=vyapari_darbaar_test
          DB_USERNAME=vyapari_test
          DB_PASSWORD=vyapari_test_password

          CACHE_STORE=redis
          QUEUE_CONNECTION=redis

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          REDIS_DB=0
          REDIS_CACHE_DB=1

          REDIS_PREFIX=vyapari_darbaar_ci_database_
          CACHE_PREFIX=vyapari_darbaar_ci_cache_

          SESSION_DRIVER=array

          MAIL_MAILER=array
          MAIL_FROM_ADDRESS=test@example.com
          MAIL_FROM_NAME="Vyapari Darbaar"

          FRONTEND_ADMIN_URL=http://localhost:3000
          FRONTEND_USER_URL=http://localhost:3000
          SUPPORT_EMAIL=support@example.com

          BCRYPT_ROUNDS=4
          EOF


      - name: Verify CI Environment
        shell: bash

        run: |
          set -euo pipefail

          grep -q '^APP_ENV=testing$' .env
          grep -q '^DB_DATABASE=vyapari_darbaar_test$' .env
          grep -q '^QUEUE_CONNECTION=redis$' .env
          grep -q '^CACHE_STORE=redis$' .env
          grep -q '^REDIS_DB=0$' .env
          grep -q '^REDIS_CACHE_DB=1$' .env

          echo "CI environment PASS"


      # ----------------------------------------------------------
      # Composer
      # ----------------------------------------------------------

      - name: Validate Composer
        shell: bash

        run: |
          set -euo pipefail

          composer validate \
            --no-check-publish \
            --no-interaction


      - name: Install Composer Dependencies
        shell: bash

        run: |
          set -euo pipefail

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress


      # ----------------------------------------------------------
      # Laravel
      # ----------------------------------------------------------

      - name: Verify Laravel
        shell: bash

        run: |
          set -euo pipefail

          php artisan --version
          php artisan env


      - name: Clear Laravel Cache
        shell: bash

        run: |
          set -euo pipefail

          php artisan optimize:clear


      # ----------------------------------------------------------
      # Redis
      # ----------------------------------------------------------

      - name: Verify Redis
        shell: bash

        run: |
          set -euo pipefail

          php -r '
          try {
              if (!class_exists("Redis")) {
                  throw new RuntimeException(
                      "PhpRedis extension unavailable"
                  );
              }

              $redis = new Redis();

              if (!$redis->connect(
                  "127.0.0.1",
                  6379,
                  5
              )) {
                  throw new RuntimeException(
                      "Unable to connect to Redis"
                  );
              }

              if ($redis->ping() === false) {
                  throw new RuntimeException(
                      "Redis PING failed"
                  );
              }

              $redis->select(0);

              $key =
                  "vyapari:ci:default:" .
                  getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 0 test failed"
                  );
              }

              $redis->del($key);


              $redis->select(1);

              $key =
                  "vyapari:ci:cache:" .
                  getmypid();

              $redis->setex(
                  $key,
                  30,
                  "ok"
              );

              if ($redis->get($key) !== "ok") {
                  throw new RuntimeException(
                      "Redis DB 1 test failed"
                  );
              }

              $redis->del($key);

              $redis->close();

              echo "Redis PASS\n";

          } catch (Throwable $e) {
              fwrite(
                  STDERR,
                  "ERROR: " .
                  $e->getMessage() .
                  PHP_EOL
              );

              exit(1);
          }
          '


      # ----------------------------------------------------------
      # Database
      # ----------------------------------------------------------

      - name: Run Migrations
        shell: bash

        run: |
          set -euo pipefail

          php artisan migrate --force


      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------

      - name: Run Laravel Tests
        shell: bash

        run: |
          set -euo pipefail

          php artisan test


      # ----------------------------------------------------------
      # Cacheability
      # ----------------------------------------------------------

      - name: Verify Laravel Production Caches
        shell: bash

        run: |
          set -euo pipefail

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Laravel cache build PASS"

          php artisan optimize:clear



  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy Dev Server
    needs: test

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7


      # ----------------------------------------------------------
      # Deployment metadata
      # ----------------------------------------------------------

      - name: Create Deployment ID
        shell: bash

        run: |
          set -euo pipefail

          DEPLOY_ID="$(
            date -u +%Y%m%d%H%M%S
          )-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" \
            >> "$GITHUB_ENV"

          echo "Deploy ID: $DEPLOY_ID"


      # ==========================================================
      # NETWORK
      # ==========================================================

      - name: Diagnose Deployment Network
        shell: bash

        run: |
          set +e

          echo "========================================"
          echo "GITHUB RUNNER NETWORK DIAGNOSTICS"
          echo "========================================"

          echo
          echo "===== RUNNER PUBLIC IPV4 ====="

          curl \
            -4 \
            -fsS \
            --connect-timeout 10 \
            https://api.ipify.org \
            || true

          echo


          echo
          echo "===== DEPLOYMENT TARGET ====="

          echo "Host: $DEPLOY_HOST"
          echo "SSH Port: $DEPLOY_PORT"
          echo "User: $DEPLOY_USER"
          echo "Base Path: $DEPLOY_BASE_PATH"


          echo
          echo "===== ROUTE ====="

          ip route get "$DEPLOY_HOST" \
            || true


          echo
          echo "===== TCP $DEPLOY_PORT / SSH ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT}" \
            2>/dev/null
          then

              echo "SSH PORT $DEPLOY_PORT: PASS"
              SSH_OK=1

          else

              echo "SSH PORT $DEPLOY_PORT: FAIL"
              SSH_OK=0

          fi


          echo
          echo "===== TCP 80 / HTTP ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/80" \
            2>/dev/null
          then

              echo "PORT 80: PASS"

          else

              echo "PORT 80: FAIL"

          fi


          echo
          echo "===== TCP 443 / HTTPS ====="

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/443" \
            2>/dev/null
          then

              echo "PORT 443: PASS"

          else

              echo "PORT 443: FAIL"

          fi


          echo
          echo "========================================"
          echo "NETWORK SUMMARY"
          echo "========================================"


          if [ "$SSH_OK" -ne 1 ]; then

              echo "::error::Cannot reach ${DEPLOY_HOST}:${DEPLOY_PORT}"
              echo "::error::Deployment stopped before touching application files."

              exit 1

          fi


          echo "SSH ${DEPLOY_HOST}:${DEPLOY_PORT}: REACHABLE"
          echo "Network preflight PASS"


      # ==========================================================
      # SSH SETUP
      # ==========================================================

      - name: Setup SSH
        shell: bash

        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}

        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "::error::DEV_SSH_KEY repository secret is missing."
              exit 1
          fi


          mkdir -p "$HOME/.ssh"

          chmod 700 "$HOME/.ssh"


          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/vyapari_deploy_key"


          chmod 600 \
            "$HOME/.ssh/vyapari_deploy_key"


          echo "Validating private key..."


          if ! ssh-keygen \
            -y \
            -f "$HOME/.ssh/vyapari_deploy_key" \
            >/dev/null 2>&1
          then

              echo "::error::DEV_SSH_KEY is not a valid OpenSSH private key."

              exit 1

          fi


          echo "Private key PASS"


          rm -f \
            "$HOME/.ssh/vyapari_server_key"


          KEYSCAN_OK=0


          for ATTEMPT in 1 2 3 4 5
          do

              echo "ssh-keyscan attempt ${ATTEMPT}/5"


              if ssh-keyscan \
                -4 \
                -T 10 \
                -p "$DEPLOY_PORT" \
                -t ed25519 \
                "$DEPLOY_HOST" \
                2>/dev/null \
                > "$HOME/.ssh/vyapari_server_key"
              then

                  if [ -s "$HOME/.ssh/vyapari_server_key" ]; then

                      KEYSCAN_OK=1

                      break

                  fi

              fi


              sleep "$((ATTEMPT * 3))"

          done


          if [ "$KEYSCAN_OK" -ne 1 ]; then

              echo "::error::Unable to retrieve SSH host key."

              exit 1

          fi


          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"


          ACTUAL_FINGERPRINT="$(
            ssh-keygen \
              -lf "$HOME/.ssh/vyapari_server_key" \
              | awk 'NR == 1 {print $2}'
          )"


          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"


          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then

              echo "::error::SSH server fingerprint mismatch."

              exit 1

          fi


          cp \
            "$HOME/.ssh/vyapari_server_key" \
            "$HOME/.ssh/known_hosts"


          chmod 600 \
            "$HOME/.ssh/known_hosts"


          rm -f \
            "$HOME/.ssh/vyapari_server_key"


          echo "SSH host verification PASS"


      # ==========================================================
      # SSH AUTHENTICATION
      # ==========================================================

      - name: Verify SSH Authentication
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/vyapari_deploy_key" \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            '
            set -e

            echo "SSH AUTHENTICATION PASS"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"

            php8.3 -v
            composer --version
            '


      # ==========================================================
      # SERVER PREFLIGHT
      # ==========================================================

      - name: Server Preflight
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/vyapari_deploy_key" \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail


          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"


          echo "========================================"
          echo "SERVER PREFLIGHT"
          echo "========================================"

          echo "Base:    $BASE_PATH"
          echo "Current: $CURRENT_PATH"
          echo "Shared:  $SHARED_PATH"


          # ------------------------------------------------------
          # Required commands
          # ------------------------------------------------------

          for COMMAND in \
              php8.3 \
              composer \
              rsync \
              mysqldump \
              gzip \
              python3
          do

              if ! command -v "$COMMAND" >/dev/null 2>&1; then

                  echo "ERROR: Required command missing: $COMMAND"

                  exit 1

              fi

          done


          echo "Required commands PASS"


          # ------------------------------------------------------
          # PHP extensions
          # ------------------------------------------------------

          php8.3 -r '
          $extensions = [
              "redis",
              "pdo_mysql",
              "mbstring",
              "intl",
              "bcmath",
              "xml",
              "curl",
              "fileinfo",
          ];

          foreach ($extensions as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(
                      STDERR,
                      "ERROR: Missing server PHP extension: {$extension}\n"
                  );

                  exit(1);
              }
          }

          echo "Server PHP extensions PASS\n";
          '


          # ------------------------------------------------------
          # Shared env
          # ------------------------------------------------------

          test -f "$SHARED_PATH/.env" || {
              echo "ERROR: $SHARED_PATH/.env missing"
              exit 1
          }


          test -r "$SHARED_PATH/.env" || {
              echo "ERROR: shared .env is not readable"
              exit 1
          }


          # ------------------------------------------------------
          # Shared directories
          # ------------------------------------------------------

          mkdir -p \
              "$SHARED_PATH/storage/app/private" \
              "$SHARED_PATH/storage/app/public" \
              "$SHARED_PATH/storage/framework/cache/data" \
              "$SHARED_PATH/storage/framework/sessions" \
              "$SHARED_PATH/storage/framework/testing" \
              "$SHARED_PATH/storage/framework/views" \
              "$SHARED_PATH/storage/logs" \
              "$SHARED_PATH/backups"


          test -w "$SHARED_PATH/storage" || {
              echo "ERROR: shared storage is not writable"
              exit 1
          }


          test -w "$SHARED_PATH/backups" || {
              echo "ERROR: shared backups directory is not writable"
              exit 1
          }


          # ------------------------------------------------------
          # Single-copy current directory
          # ------------------------------------------------------

          if [ -L "$CURRENT_PATH" ]; then

              TARGET="$(
                  readlink -f "$CURRENT_PATH" \
                  || true
              )"


              if [ "$TARGET" = "$BASE_PATH/releases/bootstrap" ]; then

                  echo "Converting old bootstrap symlink..."

                  rm "$CURRENT_PATH"

                  mkdir -p "$CURRENT_PATH"

              else

                  echo "ERROR: current is an unexpected symlink"
                  echo "Target: $TARGET"

                  exit 1

              fi

          fi


          mkdir -p "$CURRENT_PATH"


          test -d "$CURRENT_PATH" || {
              echo "ERROR: current directory missing"
              exit 1
          }


          test -w "$CURRENT_PATH" || {
              echo "ERROR: current directory is not writable"
              exit 1
          }


          mkdir -p "$HOME/.cache/composer"


          echo "SERVER PREFLIGHT PASS"

          REMOTE


      # ==========================================================
      # MAINTENANCE MODE
      # ==========================================================

      - name: Enable Maintenance Mode
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/vyapari_deploy_key" \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail


          CURRENT_PATH="$BASE_PATH/current"


          if \
              [ -f "$CURRENT_PATH/artisan" ] && \
              [ -f "$CURRENT_PATH/vendor/autoload.php" ]
          then

              cd "$CURRENT_PATH"

              php8.3 artisan down \
                  --retry=60

              echo "Maintenance mode ON"

          else

              echo "Existing Laravel installation not ready."
              echo "Maintenance mode skipped."

          fi

          REMOTE


      # ==========================================================
      # RSYNC
      # ==========================================================

      - name: Upload Application
        shell: bash

        run: |
          set -euo pipefail

          RSYNC_SUCCESS=0


          for ATTEMPT in 1 2 3
          do

              echo "Rsync attempt ${ATTEMPT}/3"


              if rsync \
                  -az \
                  --delete-delay \
                  --delay-updates \
                  --partial \
                  --timeout=120 \
                  --no-owner \
                  --no-group \
                  --exclude="/.git/" \
                  --exclude="/.github/" \
                  --exclude="/.env" \
                  --exclude="/.env.*" \
                  --exclude="/vendor/" \
                  --exclude="/node_modules/" \
                  --exclude="/storage/" \
                  --exclude="/public/storage" \
                  --exclude="/bootstrap/cache/*.php" \
                  --exclude="/tests/" \
                  --exclude="/docs/" \
                  --exclude="/phpunit.xml" \
                  --exclude="/.phpunit.cache/" \
                  --exclude="/README.md" \
                  -e "ssh \
                      -4 \
                      -T \
                      -o BatchMode=yes \
                      -o PasswordAuthentication=no \
                      -o KbdInteractiveAuthentication=no \
                      -o IdentitiesOnly=yes \
                      -o StrictHostKeyChecking=yes \
                      -o ConnectTimeout=15 \
                      -o ConnectionAttempts=3 \
                      -o ServerAliveInterval=15 \
                      -o ServerAliveCountMax=3 \
                      -i $HOME/.ssh/vyapari_deploy_key \
                      -p $DEPLOY_PORT" \
                  ./ \
                  "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_BASE_PATH}/current/"
              then

                  RSYNC_SUCCESS=1

                  echo "Rsync PASS"

                  break

              fi


              if [ "$ATTEMPT" -lt 3 ]; then

                  WAIT_SECONDS="$((ATTEMPT * 10))"

                  echo "Rsync failed."
                  echo "Retrying in ${WAIT_SECONDS}s..."

                  sleep "$WAIT_SECONDS"

              fi

          done


          if [ "$RSYNC_SUCCESS" -ne 1 ]; then

              echo "::error::Rsync failed after 3 attempts."

              exit 1

          fi


      # ==========================================================
      # SERVER DEPLOY
      # ==========================================================

      - name: Deploy Application
        shell: bash

        run: |
          set -euo pipefail

          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/vyapari_deploy_key" \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BASE_PATH='$DEPLOY_BASE_PATH' APP_HOST='$APP_HOST' APP_URL_EXPECTED='$APP_URL' DEPLOY_ID='$DEPLOY_ID' bash -s" <<'REMOTE'

          set -euo pipefail


          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          PHP_BIN="/usr/bin/php8.3"

          COMPOSER_BIN="$(
              command -v composer
          )"


          echo "========================================"
          echo "VYAPARI DARBAAR DEV DEPLOY"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Domain:    $APP_HOST"
          echo "Path:      $CURRENT_PATH"

          echo "========================================"


          cd "$CURRENT_PATH"


          # ------------------------------------------------------
          # Source validation
          # ------------------------------------------------------

          test -f artisan || {
              echo "ERROR: artisan missing"
              exit 1
          }


          test -f composer.json || {
              echo "ERROR: composer.json missing"
              exit 1
          }


          test -f composer.lock || {
              echo "ERROR: composer.lock missing"
              exit 1
          }


          test -f public/index.php || {
              echo "ERROR: public/index.php missing"
              exit 1
          }


          echo "Application source PASS"


          # ------------------------------------------------------
          # Environment symlink
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/.env" ] && \
              [ ! -L "$CURRENT_PATH/.env" ]
          then

              echo "ERROR: current/.env exists but is not a symlink."
              echo "Expected shared environment:"
              echo "$SHARED_PATH/.env"

              exit 1

          fi


          rm -f "$CURRENT_PATH/.env"


          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"


          test -L "$CURRENT_PATH/.env" || {
              echo "ERROR: .env symlink failed"
              exit 1
          }


          test -r "$CURRENT_PATH/.env" || {
              echo "ERROR: .env is not readable"
              exit 1
          }


          echo ".env symlink PASS"


          # ------------------------------------------------------
          # Storage symlink
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/storage" ] && \
              [ ! -L "$CURRENT_PATH/storage" ]
          then

              echo "ERROR: current/storage exists but is not a symlink."
              echo "Not deleting it automatically."

              exit 1

          fi


          rm -f "$CURRENT_PATH/storage"


          ln -s \
              "$SHARED_PATH/storage" \
              "$CURRENT_PATH/storage"


          test -L "$CURRENT_PATH/storage" || {
              echo "ERROR: storage symlink failed"
              exit 1
          }


          echo "Storage symlink PASS"


          # ------------------------------------------------------
          # Bootstrap cache
          # ------------------------------------------------------

          mkdir -p \
              "$CURRENT_PATH/bootstrap/cache"


          rm -f \
              "$CURRENT_PATH"/bootstrap/cache/*.php


          chmod 2775 \
              "$CURRENT_PATH/bootstrap/cache"


          # ------------------------------------------------------
          # Composer install
          # ------------------------------------------------------

          export COMPOSER_CACHE_DIR="$HOME/.cache/composer"


          echo "Installing production dependencies..."


          "$PHP_BIN" "$COMPOSER_BIN" install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-progress


          echo "Composer install PASS"


          # ------------------------------------------------------
          # Public storage link
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/public/storage" ] && \
              [ ! -L "$CURRENT_PATH/public/storage" ]
          then

              echo "ERROR: public/storage exists but is not a symlink."

              exit 1

          fi


          if [ ! -L "$CURRENT_PATH/public/storage" ]; then

              "$PHP_BIN" artisan storage:link

          fi


          ACTUAL_STORAGE="$(
              readlink -f \
                  "$CURRENT_PATH/public/storage" \
                  || true
          )"


          EXPECTED_STORAGE="$(
              readlink -f \
                  "$SHARED_PATH/storage/app/public" \
                  || true
          )"


          if [ "$ACTUAL_STORAGE" != "$EXPECTED_STORAGE" ]; then

              echo "ERROR: public/storage target mismatch"
              echo "Actual:   $ACTUAL_STORAGE"
              echo "Expected: $EXPECTED_STORAGE"

              exit 1

          fi


          echo "Public storage PASS"


          # ------------------------------------------------------
          # Clear stale caches
          # ------------------------------------------------------

          "$PHP_BIN" artisan optimize:clear

          "$PHP_BIN" artisan --version


          # ------------------------------------------------------
          # Infrastructure checks
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();


          // --------------------------------------------------
          // MySQL
          // --------------------------------------------------

          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();


          $database = config(
              "database.connections.mysql.database"
          );


          if ($database !== "vyapari_darbaar_dev") {
              throw new RuntimeException(
                  "Unsafe database target: " .
                  $database
              );
          }


          echo "MySQL connection PASS\n";
          echo "Database target PASS\n";


          // --------------------------------------------------
          // APP URL
          // --------------------------------------------------

          $expectedUrl =
              "https://api.vyaparidarbar.com";


          $actualUrl = rtrim(
              (string) config("app.url"),
              "/"
          );


          if ($actualUrl !== $expectedUrl) {
              throw new RuntimeException(
                  "APP_URL mismatch. Expected: " .
                  $expectedUrl .
                  "; Actual: " .
                  $actualUrl
              );
          }


          echo "APP_URL PASS\n";


          // --------------------------------------------------
          // Redis DB isolation
          // --------------------------------------------------

          $defaultDb = (string) config(
              "database.redis.default.database"
          );

          $cacheDb = (string) config(
              "database.redis.cache.database"
          );


          if ($defaultDb !== "10") {
              throw new RuntimeException(
                  "Server REDIS_DB must be 10"
              );
          }


          if ($cacheDb !== "11") {
              throw new RuntimeException(
                  "Server REDIS_CACHE_DB must be 11"
              );
          }


          echo "Redis DB isolation PASS\n";


          // --------------------------------------------------
          // Queue
          // --------------------------------------------------

          if (config("queue.default") !== "redis") {
              throw new RuntimeException(
                  "QUEUE_CONNECTION must be redis"
              );
          }


          echo "Redis queue PASS\n";


          // --------------------------------------------------
          // Redis connection
          // --------------------------------------------------

          if (
              \Illuminate\Support\Facades\Redis::connection()
                  ->ping() === false
          ) {
              throw new RuntimeException(
                  "Redis PING failed"
              );
          }


          echo "Redis connection PASS\n";


          // --------------------------------------------------
          // Redis cache
          // --------------------------------------------------

          $cacheKey =
              "vyapari:deploy:cache:" .
              getmypid();


          \Illuminate\Support\Facades\Cache::store("redis")
              ->put(
                  $cacheKey,
                  "ok",
                  60
              );


          if (
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->get($cacheKey) !== "ok"
          ) {
              throw new RuntimeException(
                  "Redis cache test failed"
              );
          }


          \Illuminate\Support\Facades\Cache::store("redis")
              ->forget($cacheKey);


          echo "Redis cache PASS\n";


          // --------------------------------------------------
          // Redis lock
          // --------------------------------------------------

          $lock =
              \Illuminate\Support\Facades\Cache::store("redis")
                  ->lock(
                      "vyapari:deploy:lock:" .
                      getmypid(),
                      10
                  );


          if (!$lock->get()) {
              throw new RuntimeException(
                  "Redis lock test failed"
              );
          }


          $lock->release();


          echo "Redis lock PASS\n";
          '


          # ------------------------------------------------------
          # Read DB credentials from Laravel
          # ------------------------------------------------------

          export CURRENT_PATH


          DB_NAME="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.database"
              );
              '
          )"


          DB_USER="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.username"
              );
              '
          )"


          DB_PASS="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.password"
              );
              '
          )"


          DB_HOST="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.host"
              );
              '
          )"


          DB_PORT="$(
              "$PHP_BIN" -r '
              require getenv("CURRENT_PATH")."/vendor/autoload.php";

              $app =
                  require getenv("CURRENT_PATH")."/bootstrap/app.php";

              $app->make(
                  \Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              echo config(
                  "database.connections.mysql.port"
              );
              '
          )"


          DB_PORT="${DB_PORT:-3306}"


          if [ "$DB_NAME" != "vyapari_darbaar_dev" ]; then

              unset DB_PASS

              echo "ERROR: Unsafe database target: $DB_NAME"

              exit 1

          fi


          test -n "$DB_USER" || {
              unset DB_PASS
              echo "ERROR: DB username empty"
              exit 1
          }


          test -n "$DB_HOST" || {
              unset DB_PASS
              echo "ERROR: DB host empty"
              exit 1
          }


          # ------------------------------------------------------
          # Mandatory pre-migration DB backup
          # ------------------------------------------------------

          BACKUP_FILE="$SHARED_PATH/backups/db-before-$DEPLOY_ID.sql.gz"
          BACKUP_TMP="${BACKUP_FILE}.tmp"


          rm -f "$BACKUP_TMP"


          echo "Creating database backup..."


          if ! \
              MYSQL_PWD="$DB_PASS" \
              mysqldump \
                  --host="$DB_HOST" \
                  --port="$DB_PORT" \
                  --user="$DB_USER" \
                  --single-transaction \
                  --quick \
                  --lock-tables=false \
                  --no-tablespaces \
                  "$DB_NAME" \
              | gzip \
              > "$BACKUP_TMP"
          then

              rm -f "$BACKUP_TMP"

              unset DB_PASS

              echo "ERROR: Database backup failed"

              exit 1

          fi


          unset DB_PASS


          if [ ! -s "$BACKUP_TMP" ]; then

              rm -f "$BACKUP_TMP"

              echo "ERROR: Database backup is empty"

              exit 1

          fi


          mv \
              "$BACKUP_TMP" \
              "$BACKUP_FILE"


          chmod 600 \
              "$BACKUP_FILE"


          echo "Database backup PASS"


          # ------------------------------------------------------
          # Keep only latest 5 DB backups
          # ------------------------------------------------------

          find "$SHARED_PATH/backups" \
              -maxdepth 1 \
              -type f \
              -name 'db-before-*.sql.gz' \
              -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | xargs -r rm -f


          echo "Backup rotation PASS"


          # ------------------------------------------------------
          # Migrations
          # ------------------------------------------------------

          echo "Running migrations..."


          "$PHP_BIN" artisan migrate --force


          echo "Migrations PASS"


          # ------------------------------------------------------
          # Laravel production caches
          # ------------------------------------------------------

          "$PHP_BIN" artisan config:cache

          "$PHP_BIN" artisan route:cache

          "$PHP_BIN" artisan view:cache


          echo "Laravel caches PASS"


          # ------------------------------------------------------
          # Queue restart signal
          # ------------------------------------------------------

          "$PHP_BIN" artisan queue:restart


          echo "Queue restart signal PASS"


          # ------------------------------------------------------
          # Deployment metadata
          # ------------------------------------------------------

          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"


          # ------------------------------------------------------
          # Application online
          # ------------------------------------------------------

          "$PHP_BIN" artisan up


          echo "Maintenance mode OFF"


          # ------------------------------------------------------
          # Laravel boot / DB check
          # ------------------------------------------------------

          "$PHP_BIN" -r '
          require "vendor/autoload.php";

          $app = require "bootstrap/app.php";

          $app->make(
              \Illuminate\Contracts\Console\Kernel::class
          )->bootstrap();

          \Illuminate\Support\Facades\DB::connection()
              ->getPdo();

          echo "Laravel post-deploy boot PASS\n";
          '


          # ------------------------------------------------------
          # LOCAL NGINX -> PHP-FPM -> LARAVEL CHECK
          # ------------------------------------------------------

          echo "Running local HTTP health check..."


          if ! python3 <<'PY'
          import http.client
          import json
          import sys

          host = "api.vyaparidarbar.com"

          connection = None

          try:
              connection = http.client.HTTPConnection(
                  "127.0.0.1",
                  80,
                  timeout=10,
              )

              connection.request(
                  "GET",
                  "/api/admin/profile",
                  headers={
                      "Host": host,
                      "Accept": "application/json",
                      "Connection": "close",
                  },
              )

              response = connection.getresponse()

              body = response.read().decode(
                  "utf-8",
                  errors="replace",
              )

              print("Status:", response.status)
              print(
                  "Content-Type:",
                  response.getheader("Content-Type"),
              )
              print("Body:", body[:1000])


              if response.status != 401:
                  print(
                      "ERROR: Expected HTTP 401",
                      file=sys.stderr,
                  )
                  sys.exit(1)


              try:
                  payload = json.loads(body)

              except json.JSONDecodeError:
                  print(
                      "ERROR: Response is not JSON",
                      file=sys.stderr,
                  )
                  sys.exit(1)


              if payload.get("status") is not False:
                  print(
                      "ERROR: status field must be false",
                      file=sys.stderr,
                  )
                  sys.exit(1)


              if payload.get("message") != "Unauthenticated.":
                  print(
                      "ERROR: Unexpected auth message",
                      file=sys.stderr,
                  )
                  sys.exit(1)


              print(
                  "Local Laravel HTTP health check PASS"
              )


          except Exception as exc:
              print(
                  "ERROR: Local HTTP health check failed: "
                  + repr(exc),
                  file=sys.stderr,
              )

              sys.exit(1)


          finally:
              if connection is not None:
                  try:
                      connection.close()
                  except Exception:
                      pass

          PY
          then

              echo "ERROR: Post-deployment local HTTP health check failed"

              "$PHP_BIN" artisan down \
                  --retry=60 \
                  || true

              exit 1

          fi


          echo
          echo "========================================"
          echo "SERVER DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Domain:    $APP_HOST"
          echo "Path:      $CURRENT_PATH"
          echo "Deploy ID: $DEPLOY_ID"
          echo "========================================"

          REMOTE


      # ==========================================================
      # PUBLIC HTTPS HEALTH CHECK
      # ==========================================================

      - name: Verify Public HTTPS API
        shell: bash

        run: |
          set -euo pipefail

          python3 <<'PY'
          import http.client
          import json
          import ssl
          import sys
          import time

          host = "api.vyaparidarbar.com"

          last_error = None

          for attempt in range(1, 6):

              connection = None

              try:
                  print(
                      f"Public HTTPS attempt {attempt}/5"
                  )

                  context = ssl.create_default_context()

                  connection = http.client.HTTPSConnection(
                      host,
                      443,
                      timeout=15,
                      context=context,
                  )

                  connection.request(
                      "GET",
                      "/api/admin/profile",
                      headers={
                          "Accept": "application/json",
                          "Connection": "close",
                      },
                  )

                  response = connection.getresponse()

                  body = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  print(
                      "HTTP status:",
                      response.status,
                  )

                  print(
                      "Content-Type:",
                      response.getheader(
                          "Content-Type"
                      ),
                  )

                  print(
                      "Response:",
                      body[:1000],
                  )


                  if response.status != 401:
                      raise RuntimeError(
                          "Expected HTTP 401, got "
                          + str(response.status)
                      )


                  payload = json.loads(body)


                  if payload.get("status") is not False:
                      raise RuntimeError(
                          "Unexpected status field"
                      )


                  if (
                      payload.get("message")
                      != "Unauthenticated."
                  ):
                      raise RuntimeError(
                          "Unexpected auth message"
                      )


                  print(
                      "Public HTTPS API health check PASS"
                  )

                  sys.exit(0)


              except Exception as exc:

                  last_error = exc

                  print(
                      "Attempt failed:",
                      repr(exc),
                  )


                  if attempt < 5:
                      time.sleep(attempt * 3)


              finally:

                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass


          print(
              "ERROR: Public HTTPS health check failed: "
              + repr(last_error),
              file=sys.stderr,
          )

          sys.exit(1)

          PY


      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Deployment Failure Diagnostics
        if: failure()
        continue-on-error: true
        shell: bash

        run: |
          set +e

          echo
          echo "========================================"
          echo "DEPLOYMENT FAILURE DIAGNOSTICS"
          echo "========================================"


          echo
          echo "===== DEPLOYMENT TARGET ====="

          echo "$DEPLOY_HOST:$DEPLOY_PORT"


          echo
          echo "===== NETWORK ====="


          if timeout 10 bash -c \
              "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT}" \
              2>/dev/null
          then

              echo "SSH PORT: REACHABLE"

          else

              echo "SSH PORT: UNREACHABLE"

              echo "Remote diagnostics skipped."

              exit 0

          fi


          if [ ! -f "$HOME/.ssh/vyapari_deploy_key" ]; then

              echo "SSH key not initialized."
              echo "Remote diagnostics skipped."

              exit 0

          fi


          if [ ! -f "$HOME/.ssh/known_hosts" ]; then

              echo "known_hosts not initialized."
              echo "Remote diagnostics skipped."

              exit 0

          fi


          ssh \
            -4 \
            -T \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            -i "$HOME/.ssh/vyapari_deploy_key" \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE' \
            || true

          set +e


          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"


          echo
          echo "===== ARTISAN ABOUT ====="


          if [ -f "$CURRENT_PATH/artisan" ]; then

              cd "$CURRENT_PATH"

              php8.3 artisan about \
                  2>&1 \
                  | tail -n 100 \
                  || true

          else

              echo "artisan not found"

          fi


          echo
          echo "===== LARAVEL LOG ====="

          tail -n 100 \
              "$SHARED_PATH/storage/logs/laravel.log" \
              2>/dev/null \
              || true


          echo
          echo "===== DEPLOYMENT ID ====="

          cat \
              "$CURRENT_PATH/DEPLOY_ID" \
              2>/dev/null \
              || true


          echo
          echo "===== STORAGE ====="

          ls -ld \
              "$CURRENT_PATH/storage" \
              "$CURRENT_PATH/public/storage" \
              2>/dev/null \
              || true


          echo
          echo "===== DISK ====="

          df -h \
              "$CURRENT_PATH" \
              2>/dev/null \
              || true


          echo
          echo "===== MEMORY ====="

          free -h \
              2>/dev/null \
              || true

          REMOTE


          exit 0


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup SSH
        if: always()
        shell: bash

        run: |
          set +e

          rm -f \
              "$HOME/.ssh/vyapari_deploy_key"

          rm -f \
              "$HOME/.ssh/vyapari_server_key"

          rm -f \
              "$HOME/.ssh/known_hosts"

          exit 0
